name: Bump bus link cache

on:
  push:
    paths:
      - '.github/workflows/bump-bus-link-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump builder version
        run: |
          sed -i 's/tutu-links-1/tutu-links-2/g' index.html index-en.html index-hi.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-bus-link-cache.yml
          git add index.html index-en.html index-hi.html
          git commit -m "Refresh Tutu link builder cache"
          git push origin HEAD:main
