name: Cross-browser tours QA

on:
  pull_request:
    paths:
      - 'assets/tour-form.js'
      - 'assets/tour-form.css'
      - 'assets/tour-catalog.js'
      - 'index.html'
      - 'index-ru.html'
      - 'index-hi.html'
      - 'tests/tours-cross-browser.py'
      - '.github/workflows/tour-cross-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium Firefox WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test 3 languages in 3 browser engines at mobile tablet desktop sizes
        run: python tests/tours-cross-browser.py . /tmp/tour-cross-browser
      - name: Store screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tours-cross-browser
          path: /tmp/tour-cross-browser
          if-no-files-found: warn
