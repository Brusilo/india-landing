name: Harden hotel links v5

on:
  push:
    paths:
      - '.github/workflows/harden-hotel-links-v5.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified hotel slugs
        run: |
          sed -i "/'ru-saint-petersburg':'saint_petersburg',/a\    'ru-yekaterinburg':'ekaterinburg'," assets/tutu-link-builder.js
          sed -i "/'in-bengaluru':'bangalore'/i\    'in-kochi':'cochin'," assets/tutu-link-builder.js
          sed -i 's/tutu-links-4/tutu-links-5/g' index.html index-en.html index-hi.html
      - name: Validate
        run: |
          node --check assets/tutu-link-builder.js
          node - <<'NODE'
          global.window={};require('./assets/tutu-link-builder.js');const L=window.TUTU_LINKS;
          const p=(id,country,canonical,ru)=>({id,country,canonical,name:{ru}});
          if(L.hotelSlug(p('ru-yekaterinburg','RU','Yekaterinburg','Екатеринбург'))!=='ekaterinburg')throw Error('ekaterinburg hotel slug');
          if(L.hotelSlug(p('in-kochi','IN','Kochi','Кочи'))!=='cochin')throw Error('cochin hotel slug');
          const d=(y,m,day)=>new Date(y,m-1,day);
          let u=L.build('hotel',{destination:p('in-kochi','IN','Kochi','Кочи'),start:d(2026,9,20),end:d(2026,9,22),adults:2,children:0,childAges:[]});
          if(!u.includes('/c_india/cochin/')||!u.includes('check_in=2026-09-20')||!u.includes('check_out=2026-09-22'))throw Error(u);
          console.log('hotel v5 OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-hotel-links-v5.yml
          git add assets/tutu-link-builder.js index.html index-en.html index-hi.html
          git commit -m "Harden verified Tutu hotel links"
          git push origin HEAD:main
