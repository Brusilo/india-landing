name: Fix verified Russia avia slugs v7

on:
  push:
    paths:
      - '.github/workflows/fix-russia-slugs-v7.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified slugs
        run: |
          sed -i "/'ru-makhachkala':'Mahachkala',/a\    'ru-grozny':'Grozniy',\n    'ru-astrakhan':'Astrahan'," assets/tutu-link-builder.js
          sed -i 's/tutu-links-6/tutu-links-7/g' index.html index-en.html index-hi.html
      - name: Validate
        run: |
          node --check assets/tutu-link-builder.js
          node - <<'NODE'
          global.window={};require('./assets/tutu-link-builder.js');const L=window.TUTU_LINKS;
          const p=(id,canonical)=>({id,country:'RU',canonical,name:{ru:canonical}});
          if(L.aviaSlug(p('ru-grozny','Grozny'))!=='Grozniy')throw Error('Grozniy');
          if(L.aviaSlug(p('ru-astrakhan','Astrakhan'))!=='Astrahan')throw Error('Astrahan');
          console.log('Russia slugs v7 OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-russia-slugs-v7.yml
          git add assets/tutu-link-builder.js index.html index-en.html index-hi.html
          git commit -m "Fix verified Russia avia slugs"
          git push origin HEAD:main
