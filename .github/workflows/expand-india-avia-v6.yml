name: Expand verified India avia IDs v6

on:
  push:
    paths:
      - '.github/workflows/expand-india-avia-v6.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified IDs
        run: |
          sed -i "/'in-jaipur':2648,/a\    'in-amritsar':2614,\n    'in-varanasi':2631,\n    'in-lucknow':2677,\n    'in-guwahati':2639,\n    'in-bhubaneswar':2628," assets/tutu-link-builder.js
          sed -i 's/tutu-links-5/tutu-links-6/g' index.html index-en.html index-hi.html
      - name: Validate
        run: |
          node --check assets/tutu-link-builder.js
          node - <<'NODE'
          global.window={};require('./assets/tutu-link-builder.js');const L=window.TUTU_LINKS;
          const p=(id,country,canonical,ru)=>({id,country,canonical,name:{ru}});
          const d=(y,m,day)=>new Date(y,m-1,day);
          const from=p('in-delhi','IN','Delhi','Дели');
          const tests=[
            ['in-amritsar','Amritsar','Амритсар',2614,'Amritsar'],
            ['in-varanasi','Varanasi','Варанаси',2631,'Varanasi'],
            ['in-lucknow','Lucknow','Лакхнау',2677,'Lakhnau'],
            ['in-guwahati','Guwahati','Гувахати',2639,'Guvahati'],
            ['in-bhubaneswar','Bhubaneswar','Бхубанешвар',2628,'Bhubaneshvar']
          ];
          for(const [id,en,ru,n,slug] of tests){
            const u=L.build('flight',{from,to:p(id,'IN',en,ru),date:d(2026,9,20),adults:1,children:0,childAges:[],cabin:'economy'});
            if(!u.includes('/f/Deli/'+slug+'/')||!u.includes('route%5B0%5D=216-20092026-'+n))throw Error(u);
          }
          console.log('India avia v6 OK');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-india-avia-v6.yml
          git add assets/tutu-link-builder.js index.html index-en.html index-hi.html
          git commit -m "Expand verified India avia IDs"
          git push origin HEAD:main
