name: Compact routes carousel layout v14

on:
  push:
    paths:
      - '.github/workflows/compact-routes-v14.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align routes section with hotels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          for fn in ('index.html','index-en.html','index-hi.html'):
              p=Path(fn)
              h=p.read_text(encoding='utf-8')
              m=re.search(r'<section class="section" id="routes">.*?</section>',h,re.S)
              assert m, f'routes section missing: {fn}'
              sec=m.group(0)

              navm=re.search(r'\n\s*<div class="filters-bar filters-bar--nav-only">\s*(<div class="carousel-nav" data-carousel="routes">.*?</div>)\s*</div>',sec,re.S)
              assert navm, f'routes nav row missing: {fn}'
              nav=navm.group(1).strip()
              sec=sec.replace(navm.group(0),'',1)

              seem=re.search(r'<div class="head-actions__see">.*?</div>',sec,re.S)
              assert seem, f'route see-all missing: {fn}'
              insert=(seem.group(0)+'\n          <div class="head-actions__nav">\n'+textwrap.indent(nav,'            ')+'\n          </div>')
              sec=sec.replace(seem.group(0),insert,1)
              h=h[:m.start()]+sec+h[m.end():]
              h=re.sub(r'assets/search-v2\.css\?v=[^"\']+','assets/search-v2.css?v=20260917-routes-14',h)
              p.write_text(h,encoding='utf-8')

          css=Path('assets/search-v2.css')
          s=css.read_text(encoding='utf-8')
          s=re.sub(r'\n*/\* Route section spacing after removing transport filters\. \*/\s*#routes \.section-head \{ margin-top: 16px; \}\s*','\n',s)
          css.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ('index.html','index-en.html','index-hi.html'):
              h=Path(fn).read_text(encoding='utf-8')
              assert 'filters-bar filters-bar--nav-only' not in h
              assert '<div class="head-actions__nav">' in h
              assert 'data-carousel="routes"' in h
              assert 'assets/search-v2.css?v=20260917-routes-14' in h
          css=Path('assets/search-v2.css').read_text(encoding='utf-8')
          assert '#routes .section-head { margin-top: 16px; }' not in css
          print('route layout v14 OK')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/compact-routes-v14.yml
          git add -A
          git commit -m 'Align route carousel spacing with hotels'
          git push
