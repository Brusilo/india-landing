name: Fix hotel empty date style

on:
  push:
    paths:
      - .github/workflows/fix-hotel-empty-date-style.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/fix_hotel_empty_date.py
      - name: Validate
        run: |
          grep -q 'hotel-date-placeholder-3' index.html
          grep -q 'hotel-date-placeholder-3' index-en.html
          grep -q 'hotel-date-placeholder-3' index-hi.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hotel-empty-date-style.yml .github/scripts/fix_hotel_empty_date.py
          git add assets/search-v2.css index.html index-en.html index-hi.html
          git commit -m "Match hotel empty date to placeholder style"
          git push origin HEAD:main
