name: Generate static visual tours catalogue
on:
  push:
    branches:
      - feature/tour-search-india-20261011
    paths:
      - 'scripts/generate-visual-tours-data.py'
      - '.github/workflows/generate-visual-tours.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare public catalogue scraper
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate offline destination options from public selector
        run: python scripts/generate-visual-tours-data.py
      - name: Commit generated data to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tour-public-options.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate visual-only tour location catalogue from public Travelata options"
          git pull --rebase origin feature/tour-search-india-20261011
          git push origin HEAD:feature/tour-search-india-20261011
