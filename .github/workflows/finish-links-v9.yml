name: Finish route and hotel links v9

on:
  push:
    paths:
      - '.github/workflows/finish-links-v9.yml'

permissions:
  contents: write

jobs:
  finish-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply link, city and price fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Expand the place database with verified Black Sea / resort destinations.
          p = root / 'assets/search-places.js'
          s = p.read_text(encoding='utf-8')
          if "['RU','Лоо','Loo'" not in s:
              marker = '    // India — international and high-demand nodes'
              assert marker in s
              resort_rows = """    // Russia — resort destinations available on Tutu Hotels
              ['RU','Адлер','Adler','एडलर','','Sochi Airport AER Адлер',123],
              ['RU','Туапсе','Tuapse','तुआप्से','','',124],
              ['RU','Лоо','Loo','लू','','',125],
              ['RU','Дагомыс','Dagomys','दागोमिस','','',126],
              ['RU','Красная Поляна','Krasnaya Polyana','क्रास्नाया पोल्याना','','',127],
              ['RU','Джубга','Dzhubga','जुबगा','','',128],
              ['RU','Домбай','Dombay','दोम्बाय','','',129],
              ['RU','Ольгинка','Olginka','ओल्गिंका','','',130],
              ['RU','Архипо-Осиповка','Arkhipo-Osipovka','आर्खिपो-ओसिपोव्का','','Arkhipo Osipovka',131],
              ['RU','Эстосадок','Estosadok','एस्तोसादोक','','Esto-Sadok Эсто-Садок',132],
              ['RU','Бетта','Betta','बेट्टा','','',133],

          """
              s = s.replace(marker, resort_rows + marker, 1)
              p.write_text(s, encoding='utf-8')

          # 2) Unknown text / unsupported combinations fall back to official Tutu instead of dead-ending.
          p = root / 'assets/search-v2.js'
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"  function bindSubmit\(\)\{.*?\n  \}\n\n  function bindForm", re.S)
          replacement = """  function bindSubmit(){
            const button=form.querySelector('.v2-submit');if(!button)return;
            button.addEventListener('click',()=>{
              const state=states[mode];
              const unknown=mode==='hotel'
                ? !!(state.destinationText&&state.destinationText.trim())&&!state.destination
                : (!!(state.fromText&&state.fromText.trim())&&!state.from)||!!(state.toText&&state.toText.trim())&&!state.to;
              if(unknown){window.location.assign('https://www.tutu.ru/');return}
              try{
                if(!window.TUTU_LINKS){const e=new Error('unsupported');e.code='unsupported';throw e}
                const url=window.TUTU_LINKS.build(mode,state);
                window.location.assign(url);
              }catch(err){
                const code=err&&err.code?err.code:'unsupported';
                if(code==='unsupported'){window.location.assign('https://www.tutu.ru/');return}
                alert(window.TUTU_LINKS?window.TUTU_LINKS.message(code,pageLang):code);
              }
            });
          }

          function bindForm"""
          s2, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'bindSubmit replacement count={n}'
          p.write_text(s2, encoding='utf-8')

          # 3) Buses must go to bus.tutu.ru, not the train section.
          p = root / 'assets/tutu-link-builder.js'
          s = p.read_text(encoding='utf-8')
          old = "  function buildBus(s){return buildRailLike(s)}"
          new = """  function buildBus(s){
            requireValue(s.from,'from');
            requireValue(s.to,'to');
            requireValue(s.date,'date');
            if(samePlace(s.from,s.to))fail('sameCity');
            if(!supports('bus',s.from)||!supports('bus',s.to))unsupported();
            return 'https://bus.tutu.ru/raspisanie/gorod_'+encodeURIComponent(railSlug(s.from))+'/gorod_'+encodeURIComponent(railSlug(s.to))+'/';
          }"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Shared runtime wiring for route cards, hotel cards and all-links.
          card_js = r"""/* Route / hotel card links and audited display values. */
          (function(){
            'use strict';
            const HOME='https://www.tutu.ru/';
            const OFFERS='https://www.tutu.ru/juicy-offers/';
            const RUB_TO_INR=1.13262;
            const lang=document.documentElement.lang==='hi'?'hi':document.documentElement.lang==='en'?'en':'ru';
            const routeData={
              r1:{price:15783,h:10,m:10},
              r2:{price:1574,h:12,m:37},
              r3:{price:1681,h:14,m:27},
              r4:{price:29996,h:6,m:30},
              r5:{price:16539,h:6,m:10},
              r8:{price:2070,h:8,m:0},
              r9:{price:2746,h:3,m:30},
              r10:{price:1659,h:12,m:9}
            };
            const hotels={
              h1:{name:'Отель Булгар',city:{ru:'Казань',en:'Kazan',hi:'कज़ान'},top:{ru:'Казань · 2,9 км от центра',en:'Kazan · 2.9 km from the centre',hi:'कज़ान · केंद्र से 2.9 किमी'},meta:{ru:'Отель · 214 отзывов',en:'Hotel · 214 reviews',hi:'होटल · 214 समीक्षाएँ'},rating:'8,3',price:1833,url:'https://hotel.tutu.ru/h_otel_bulgar/'},
              h2:{name:'Грейс Амалия',city:{ru:'Сочи',en:'Sochi',hi:'सोची'},top:{ru:'Сочи · 633 м до пляжа',en:'Sochi · 633 m to the beach',hi:'सोची · समुद्र तट से 633 मी'},meta:{ru:'Отель',en:'Hotel',hi:'होटल'},rating:'9,1',price:3275,url:'https://hotel.tutu.ru/h_otel_greys_amaliya/'},
              h3:{name:'Хостел Автор Таганка',city:{ru:'Москва',en:'Moscow',hi:'मॉस्को'},top:{ru:'Москва · 3 км от центра',en:'Moscow · 3 km from the centre',hi:'मॉस्को · केंद्र से 3 किमी'},meta:{ru:'Хостел',en:'Hostel',hi:'हॉस्टल'},rating:'8,4',price:1172,url:'https://hotel.tutu.ru/h_khostel_avtor/'},
              h4:{name:'Номера у Невы',city:{ru:'Санкт-Петербург',en:'Saint Petersburg',hi:'सेंट पीटर्सबर्ग'},top:{ru:'Санкт-Петербург · 5,2 км от центра',en:'Saint Petersburg · 5.2 km from the centre',hi:'सेंट पीटर्सबर्ग · केंद्र से 5.2 किमी'},meta:{ru:'Отель · 158 отзывов',en:'Hotel · 158 reviews',hi:'होटल · 158 समीक्षाएँ'},rating:'7,8',price:2062,url:'https://hotel.tutu.ru/h_otel_art_deko_nevsky/'},
              h5:{name:'Гостевые комнаты и апартаменты Грифон',city:{ru:'Санкт-Петербург',en:'Saint Petersburg',hi:'सेंट पीटर्सबर्ग'},top:{ru:'Санкт-Петербург · 894 м от центра',en:'Saint Petersburg · 894 m from the centre',hi:'सेंट पीटर्सबर्ग · केंद्र से 894 मी'},meta:{ru:'Апартаменты',en:'Apartments',hi:'अपार्टमेंट'},rating:'',price:3227,url:'https://hotel.tutu.ru/h_gostevye_komnaty_i_apartamenty_grifon/'},
              h6:{name:'Боярин',city:{ru:'Геленджик',en:'Gelendzhik',hi:'गेलेंदझिक'},top:{ru:'Геленджик · 483 м до пляжа',en:'Gelendzhik · 483 m to the beach',hi:'गेलेंदझिक · समुद्र तट से 483 मी'},meta:{ru:'Гостевой дом · 33 отзыва',en:'Guest house · 33 reviews',hi:'गेस्ट हाउस · 33 समीक्षाएँ'},rating:'9,5',price:2500,url:'https://hotel.tutu.ru/h_gostevoy_dom_boyarin/'}
            };

            const nf=n=>Number(n).toLocaleString(lang==='en'?'en-GB':lang==='hi'?'en-IN':'ru-RU');
            const duration=(h,m)=>lang==='ru'?(h+' ч'+(m?' '+m+' мин':'')):lang==='hi'?(h+' घं'+(m?' '+m+' मि':'')):(h+' h'+(m?' '+m+' min':''));
            const tomorrow=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);return d};
            const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
            const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            const hotelAllUrl=()=>{
              const a=tomorrow(),b=addDays(a,1),p=new URLSearchParams({check_in:iso(a),check_out:iso(b),details_params:'',geo_id:'2657260',geo_name:'Москва',geo_type:'locality',resultId:'','room[0]':'3',search_id:'',sorting:'relevanceDesc'});
              return 'https://hotel.tutu.ru/c_russia/moscow/?'+p.toString();
            };
            function activate(card,url){
              card.tabIndex=0;card.setAttribute('role','link');card.style.cursor='pointer';card.dataset.href=url;
              card.addEventListener('click',e=>{if(e.target.closest('a,button'))return;window.location.assign(url)});
              card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.location.assign(url)}});
            }
            function resolvePlace(text){
              if(!window.TUTU_PLACES)return null;
              const q=String(text||'').trim();if(!q)return null;
              const norm=q.toLocaleLowerCase();
              const list=TUTU_PLACES.search(q,20)||[];
              return list.find(p=>[p.canonical,p.name&&p.name.ru,p.name&&p.name.en,p.name&&p.name.hi].filter(Boolean).some(x=>String(x).toLocaleLowerCase()===norm))||list[0]||null;
            }
            function routeUrl(card){
              const name=card.querySelector('.route-name');if(!name)return HOME;
              const parts=name.textContent.split('–').map(x=>x.trim());if(parts.length!==2)return HOME;
              const from=resolvePlace(parts[0]),to=resolvePlace(parts[1]);if(!from||!to||!window.TUTU_LINKS)return HOME;
              try{return TUTU_LINKS.build(card.dataset.transport,{from,to,date:tomorrow(),adults:1,children:0,childAges:[],cabin:'economy'})}catch(_){return HOME}
            }

            const routes=document.getElementById('routes');
            if(routes){
              const see=routes.querySelector('.see-all');if(see)see.href=OFFERS;
              const cta=routes.querySelector('.card--cta');if(cta)cta.href=OFFERS;
              ['route_r6_combined','route_r7_combined'].forEach(id=>{const x=routes.querySelector('[data-cta="'+id+'"]');if(x)x.remove()});
              routes.querySelectorAll('.card[data-transport]').forEach(card=>{
                const id=(card.dataset.cta||'').replace(/^route_/,'').replace(/_combined$/,'');
                const d=routeData[id];
                if(d){
                  const price=card.querySelector('.price');if(price)price.textContent=(lang==='en'?'from ':lang==='hi'?'से ':'от ')+nf(d.price)+' ₽';
                  const alt=card.querySelector('.price-alt');if(alt)alt.textContent='≈ ₹'+Math.round(d.price*RUB_TO_INR).toLocaleString('en-IN');
                  const meta=card.querySelector('.card-meta');if(meta)meta.textContent=duration(d.h,d.m);
                }
                activate(card,routeUrl(card));
              });
            }

            const hotelSection=document.getElementById('hotels')||document.querySelector('#hotels-row')?.closest('section');
            if(hotelSection){const see=hotelSection.querySelector('.see-all');if(see)see.href=hotelAllUrl()}
            const hotelRow=document.getElementById('hotels-row');
            if(hotelRow){
              ['h7','h8'].forEach(id=>{const x=hotelRow.querySelector('[data-cta="hotel_'+id+'"]');if(x)x.remove()});
              Object.entries(hotels).forEach(([id,d])=>{
                const card=hotelRow.querySelector('[data-cta="hotel_'+id+'"]');if(!card)return;
                const top=card.querySelector('.hotel-top');if(top)top.textContent=d.top[lang];
                const name=card.querySelector('.hotel-name');if(name)name.textContent=d.name;
                const meta=card.querySelector('.hotel-meta');if(meta)meta.textContent=d.meta[lang];
                const rating=card.querySelector('.rating');if(rating){if(d.rating)rating.textContent=d.rating;else rating.remove()}
                const price=card.querySelector('.hotel-price');if(price)price.innerHTML=(lang==='ru'?'от ':lang==='hi'?'से ':'from ')+nf(d.price)+' ₽ <span>'+(lang==='ru'?'за ночь':lang==='hi'?'प्रति रात':'per night')+'</span>';
                activate(card,d.url);
              });
              const cta=hotelRow.querySelector('.card--cta');if(cta)cta.href=hotelAllUrl();
            }
          })();
          """
          (root/'assets/card-links.js').write_text(card_js.strip()+"\n", encoding='utf-8')

          # 5) Clean up route filters, wire static all-links, refresh caches on all locales.
          html_files=['index.html','index-en.html','index-hi.html']
          for fn in html_files:
              p=root/fn
              s=p.read_text(encoding='utf-8')
              # Remove only the route-card filter pills (not the hero transport selector).
              s,n=re.subn(r'\n\s*<div class="filters" role="tablist"[^>]*>.*?</div>\n', '\n', s, count=1, flags=re.S)
              assert n==1, f'{fn}: route filters not removed'
              s=s.replace('<div class="filters-bar">','<div class="filters-bar filters-bar--nav-only">',1)
              if '.filters-bar--nav-only{justify-content:flex-end}' not in s:
                  s=s.replace('.filters-bar .filters{margin-bottom:0;min-width:0}', '.filters-bar .filters{margin-bottom:0;min-width:0}\n.filters-bar--nav-only{justify-content:flex-end}',1)
              # Route heading link: public offers page. Hotel heading gets a safe static fallback; JS adds dates.
              def patch_section(match, href):
                  sec=match.group(0)
                  return sec.replace('class="see-all" href="#"', f'class="see-all" href="{href}"', 1)
              s,n=re.subn(r'<section\b[^>]*id="routes"[^>]*>.*?</section>', lambda m: patch_section(m,'https://www.tutu.ru/juicy-offers/'), s, count=1, flags=re.S)
              assert n==1, f'{fn}: routes section not found'
              s,n=re.subn(r'<section\b[^>]*id="hotels"[^>]*>.*?</section>', lambda m: patch_section(m,'https://hotel.tutu.ru/c_russia/moscow/'), s, count=1, flags=re.S)
              # Older variants may not have id=hotels; runtime still handles the link.
              s=s.replace('rubToInr: 1.135','rubToInr: 1.133')
              s=s.replace('20260917-tutu-links-8','20260917-tutu-links-9')
              s=s.replace('<script src="assets/search-places.js"></script>','<script src="assets/search-places.js?v=20260917-places-9"></script>')
              needle='<script src="assets/search-v2.js?v=20260917-tutu-links-9"></script>'
              assert needle in s, f'{fn}: search-v2 include missing'
              if 'assets/card-links.js?v=20260917-links-9' not in s:
                  s=s.replace(needle, needle+'\n<script src="assets/card-links.js?v=20260917-links-9"></script>',1)
              p.write_text(s,encoding='utf-8')

          # Self-remove this one-off workflow after it has done its job.
          wf=root/'.github/workflows/finish-links-v9.yml'
          if wf.exists(): wf.unlink()
          PY

      - name: Validate JavaScript and page wiring
        shell: bash
        run: |
          node --check assets/search-v2.js
          node --check assets/tutu-link-builder.js
          node --check assets/search-places.js
          node --check assets/card-links.js
          python3 - <<'PY'
          from pathlib import Path
          places=Path('assets/search-places.js').read_text(encoding='utf-8')
          builder=Path('assets/tutu-link-builder.js').read_text(encoding='utf-8')
          search=Path('assets/search-v2.js').read_text(encoding='utf-8')
          links=Path('assets/card-links.js').read_text(encoding='utf-8')
          for city in ['Лоо','Туапсе','Адлер','Дагомыс','Красная Поляна','Джубга','Домбай','Ольгинка','Архипо-Осиповка','Эстосадок','Бетта']:
              assert city in places, city
          assert 'https://bus.tutu.ru/raspisanie/gorod_' in builder
          assert "window.location.assign('https://www.tutu.ru/')" in search
          assert 'https://www.tutu.ru/juicy-offers/' in links
          assert 'https://hotel.tutu.ru/h_otel_bulgar/' in links
          for fn in ['index.html','index-en.html','index-hi.html']:
              s=Path(fn).read_text(encoding='utf-8')
              assert 'role="tablist" aria-label="Фильтр маршрутов"' not in s
              assert '20260917-tutu-links-9' in s
              assert 'assets/card-links.js?v=20260917-links-9' in s
          print('v9 link pass validation OK')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish route and hotel links v9'
          git push
