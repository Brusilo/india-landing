name: Fix quick hint alignment

on:
  push:
    paths:
      - '.github/workflows/fix-quick-hints.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply quick hint alignment
        run: python3 .github/scripts/fix_quick_hints.py

      - name: Validate
        shell: bash
        run: |
          node --check assets/search-v2.js
          grep -q 'quick-group-v2--from' assets/search-v2.js
          grep -q 'quick-group-v2--to' assets/search-v2.js
          grep -q 'quick-group-v2--date' assets/search-v2.js
          grep -q 'grid-column: 3' assets/search-v2.css
          for f in index.html index-en.html index-hi.html; do
            grep -q 'search-v2.css?v=20260917-hints2' "$f"
            grep -q 'search-v2.js?v=20260917-hints2' "$f"
          done
          git diff --check

      - name: Commit fix and clean helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-quick-hints.yml .github/scripts/fix_quick_hints.py
          git add assets/search-v2.js assets/search-v2.css index.html index-en.html index-hi.html
          git commit -m "Align quick hints with search fields"
          git push origin HEAD:main
