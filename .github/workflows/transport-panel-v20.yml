name: Raise transport circle and correct heading
on:
  push:
    paths:
      - '.github/workflows/transport-panel-v20.yml'
permissions:
  contents: write
jobs:
  update-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified transport panel changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          p = Path('assets/responsive.css')
          css = p.read_text(encoding='utf-8')
          old = '.panel--transport .panel-ico { width: 128px; height: 128px; }'
          new = '''.panel--transport .panel-ico {
            width: 128px; height: 128px;
            /* Lift only this illustration; preserve text flow and the other icons. */
            transform: translateY(-16px);
          }'''
          assert css.count(old) == 1
          css = css.replace(old, new, 1)
          replacements = {
              '/* Keep the heading full-width so the larger circle cannot squeeze it. */':
                  '/* Put the circle beside the heading, with the description full-width below. */',
              '.panel--transport h2 { grid-column: 1 / -1; }':
                  '.panel--transport h2 { grid-column: 1; grid-row: 1; }',
              '.panel--transport p { grid-column: 1; margin-top: 0; }':
                  '.panel--transport p { grid-column: 1 / -1; grid-row: 2; margin-top: 0; }',
              'grid-column: 2; grid-row: 2; align-self: center; justify-self: end;':
                  'grid-column: 2; grid-row: 1; align-self: start; justify-self: end;\n    transform: none;',
          }
          for old_rule, new_rule in replacements.items():
              assert css.count(old_rule) == 1
              css = css.replace(old_rule, new_rule, 1)
          p.write_text(css, encoding='utf-8')

          titles = {
              'index.html': ('Доберитесь из своего города', 'Доберитесь до любого города'),
              'index-en.html': ('Travel from your city', 'Get to any city'),
              'index-hi.html': ('अपने शहर से यात्रा करें', 'किसी भी शहर तक पहुँचें'),
          }
          for filename, (old, new) in titles.items():
              p = Path(filename)
              html = p.read_text(encoding='utf-8')
              assert html.count('<h2>'+old+'</h2>') == 1
              html = html.replace('<h2>'+old+'</h2>', '<h2>'+new+'</h2>', 1)
              html, n = re.subn(r'assets/responsive\.css\?v=[^"\s]+', 'assets/responsive.css?v=20260917-transport-20', html)
              assert n == 1
              p.write_text(html, encoding='utf-8')

          expected = {
              'assets/responsive.css': '57b2d9079720418be1adfb28d3c7b450d0bf5f4514cefc95f81848fc49f5432b',
              'index.html': 'e19862cadce93ec3b5a5d18787c7120e8117f868bb819f2e2b5df774887520a1',
              'index-en.html': 'e11c6dfe57f4f5a30dd8cf60fe2ab4a128aeb67b3c618c9d5884fa650cfd8830',
              'index-hi.html': '1211c41724133b7508a61361c8ae3e370094a8f46af5e055275374a26c5a6916',
          }
          for filename, digest in expected.items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest, filename + ': differs from locally checked output'
          Path('.github/workflows/transport-panel-v20.yml').unlink()
          print('All four files match the local browser-tested candidate.')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/transport-panel-v20.yml
          git diff --cached --check
          git commit -m 'fix: raise transport circle and use get to any city in RU EN HI'
          git push
