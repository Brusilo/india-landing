name: Confirm final destination links
on:
  push:
    paths:
      - '.github/workflows/landing-final-links-v25.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read final candidate URLs
        run: |
          mkdir -p final-links
          python3 - <<'PY'
          import urllib.request,json,re,time,concurrent.futures,http.client
          from pathlib import Path
          hotel='''ru-novosibirsk=russia/novosibirsk;ru-orenburg=russia/orenburg;ru-stavropol=russia/stavropol;ru-veliky-novgorod=russia/novgorod_velikiy;ru-kostroma=russia/kostroma;ru-noyabrsk=russia/noyabrsk;ru-novy-urengoy=russia/novyy_urengoy;ru-blagoveshchensk=russia/blagoveschensk;ru-petropavlovsk-kamchatsky=russia/petropavlovsk_kamchatskiy;ru-komsomolsk-on-amur=russia/komsomolsk_na_amure;ru-nikolaevsk-on-amur=russia/nikolaevsk_na_amure;ru-sovetskaya-gavan=russia/sovetskaya_gavan_;ru-veliky-ustyug=russia/velikiy_ustyug;ru-elista=russia/elista;ru-yessentuki=russia/essentuki;ru-sheregesh=russia/sheregesh;in-kolkata=india/calcutta;in-bhubaneswar=india/bhubaneswar;kz-kyzylorda=kazakhstan/qyzylorda;kz-petropavl=kazakhstan/petropavlovsk;kz-turkistan=kazakhstan/turkestan;kz-oral=kazakhstan/uralsk;kz-oskemen=kazakhstan/ust_kamenogorsk;kz-baikonur=kazakhstan/baykonur;kz-zaysan=kazakhstan/zaisan;uz-zaamin=uzbekistan/zomin;kg-issyk-kul=kirgizstan/issyk-kul;tj-khujand=tadjikistan/khudzhand;tj-kulob=tadjikistan/kulyab;by-minsk=belarus/minsk;by-vitebsk=belarus/vitsyebsk;md-balti=moldova/beltsy;tm-turkmenbashi=turkmenistan/turkmanbashi;tm-turkmenabat=turkmenistan/turkmenabad'''
          flight='''ru-blagoveshchensk=Blagoveshcensk;kz-almaty=Almati;md-chisinau=Kishinyov;in-tiruchirappalli=Tiruchchirappalli;in-thiruvananthapuram=Tiruvanantapuram;kg-issyk-kul=Tamchi;tj-bokhtar=Bohtar;tm-kerki=Kerki'''
          cases=[]
          for mode,data,prefix in [('hotel',hotel,'https://hotel.tutu.ru/c_'),('flight',flight,'https://avia.tutu.ru/f/Moskva/')]:
            for entry in data.split(';'):
              id,slug=entry.split('=');cases.append({'id':id,'mode':mode,'slug':slug,'url':prefix+slug+'/'})
          for id,slug in [('ru-kazan','Kazan'),('ru-sochi','Sochi'),('ru-yoshkar-ola','Ioshkar-Ola'),('ru-adler','Adler')]:
            cases.append({'id':id,'mode':'rail-reverse','url':'https://www.tutu.ru/poezda/'+slug+'/Moskva/?date=20.09.2026&travelers=2.6'})
          for path,fr,to in [('gorod_Ufa/gorod_Kazan','1333152','1330021'),('gorod_Moskva/gorod_Sankt-Peterburg','1447874','1447624'),('gorod_Moskva/gorod_Gelendzhik','1447874','1447979'),('gorod_Moskva/gorod_Loo','1447874','2082727')]:
            cases.append({'id':path.replace('/','-'),'mode':'bus-query','url':'https://bus.tutu.ru/raspisanie/'+path+'/?from='+fr+'&to='+to+'&date=20.09.2026&travelers=2.6&amount=3'})
          cases.append({'id':'kazan-yekaterinburg','mode':'rail-pair','url':'https://www.tutu.ru/poezda/Kazan/Ekaterinburg/?date=20.09.2026&travelers=2.6'})
          def read(case):
            row=dict(case)
            try:
              with urllib.request.urlopen(urllib.request.Request(case['url'],headers={'User-Agent':'Mozilla/5.0 (compatible; LandingLinkSmokeTest/1.0)'}),timeout=7) as r:
                try:data=r.read(3500000)
                except http.client.IncompleteRead as e:data=e.partial;row['incomplete']=True
                text=data.decode('utf-8','replace');row.update(status=r.status,final_url=r.url)
                t=re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I);row['title']=t.group(1) if t else ''
                if case['mode']=='flight':
                  for key in ['arrivalCityId','arrivalCity','arrivalCityTranslit']:
                    m=re.search(r'"'+key+r'"\s*:\s*"([^"]+)"',text)
                    if m:row[key]=m.group(1)
                if case['mode']=='hotel':
                  plain=text.replace('\\"','"');m=re.search(r'"initSearchParams":\{.{0,700}?"geoId":(\d+).*?"geoName":"([^"]+)"',plain)
                  if m:row.update(geoId=int(m.group(1)),geoName=m.group(2))
                if case['mode']=='bus-query':
                  m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',text,re.S)
                  if m:
                    x=json.loads(m.group(1));row['page']=x.get('page');row['query']=x.get('query')
                Path('final-links/'+case['mode']+'-'+case['id']+'.html').write_text(text,encoding='utf-8')
            except Exception as e:
              row['error']=str(e)
              if hasattr(e,'code'):row['status']=e.code
            time.sleep(.3);return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(read,cases))
          Path('final-links/results.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf-8')
          print([(r['id'],r['mode'],r.get('status'),r.get('arrivalCity'),r.get('geoName')) for r in results])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-final-links-v25
          path: final-links/
          retention-days: 1
