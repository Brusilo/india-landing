name: Apply responsive mobile layout
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive-v15.yml'
permissions:
  contents: write
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested responsive assets and locale wiring
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = ''
          # Verify the locally browser-tested bundle before touching any site file.
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == '6e2e92e49a9f2841bee50289615632f0ee5e8f993bd847734c71cd40eed524b5'
          files = json.loads(raw)
          assert set(files) == {'assets/responsive.css', 'assets/responsive.js'}
          for name, text in files.items():
              path = Path(name)
              assert not path.exists(), name + ' already exists; review before replacing'
              path.write_text(text, encoding='utf-8')
          css = '<link rel="stylesheet" href="assets/responsive.css?v=20260917-mobile-1">\n'
          js = '<script src="assets/responsive.js?v=20260917-mobile-1"></script>\n'
          for name in ['index.html', 'index-en.html', 'index-hi.html']:
              path = Path(name)
              before = path.read_text(encoding='utf-8')
              assert 'assets/responsive.' not in before
              assert before.count('</head>') == before.count('</body>') == 1
              after = before.replace('</head>', css + '</head>', 1).replace('</body>', js + '</body>', 1)
              assert after.replace(css, '', 1).replace(js, '', 1) == before
              path.write_text(after, encoding='utf-8')
          Path('docs').mkdir(exist_ok=True)
          Path('docs/responsive-checks.md').write_text('''# Responsive layout verification
          
          Baseline: 599fe345610e2f69faf748a52f84848d098bac3f.
          Scope: presentation and compact-screen interaction only. Existing sections,
          copy, city data, prices, link builders and destinations are unchanged.
          
          ## Breakpoints
          - 320-599 CSS px: phone layout, vertical search, swipeable carousels.
          - 600-1100 CSS px: compact/tablet layout with a two-column search.
          - Above 1100 CSS px: original desktop layout and original header/footer DOM.
          No user-agent redirects and no separate mobile URLs.
          
          ## Browser checks run locally before publishing
          Chromium with Playwright, actual project assets rendered offline.
          132 form scenarios: RU / EN / HI x hotel / flight / train / bus x
          320, 360, 375, 390, 414, 480, 600, 768, 820, 1024 and 1100 CSS px.
          
          Verified: viewport containment, empty grey date placeholders, six initial
          suggestions remaining open after tap, search in all three scripts, city
          selection, swapping cities, single/range dates, adults and child age,
          service class, and form state passed to the unchanged URL builder.
          Navigation was intercepted; this was not a new live Tutu availability test.
          
          Real emulated touch swipes moved both carousels in all three locales.
          Header menus and footer accordions work. Resizing restores the original
          desktop DOM without losing selected search values.
          
          Full-page desktop screenshots at 1440 px were pixel-identical to the
          baseline for RU, EN and HI. Original page copy and card contents were
          also compared after mobile-to-desktop resizing.
          
          These are Chromium browser-emulation checks, not physical iOS/Android
          device or Safari/WebKit testing.
          ''', encoding='utf-8')
          Path('.github/workflows/mobile-responsive-v15.yml').unlink()
          print('Responsive assets installed; all existing HTML content preserved.')
          PY
      - name: Validate JavaScript and locale includes
        run: |
          node --check assets/responsive.js
          node --check assets/search-v2.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'index-en.html', 'index-hi.html']:
              text = Path(name).read_text(encoding='utf-8')
              assert text.count('assets/responsive.css?v=20260917-mobile-1') == 1
              assert text.count('assets/responsive.js?v=20260917-mobile-1') == 1
              assert 'name="viewport"' in text
          print('RU / EN / HI wiring OK')
          PY
      - name: Commit responsive layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css assets/responsive.js index.html index-en.html index-hi.html docs/responsive-checks.md .github/workflows/mobile-responsive-v15.yml
          git commit -m 'feat: responsive mobile and tablet layout for RU EN HI'
          git push
