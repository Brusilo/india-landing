name: Apply responsive mobile layout
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive-v15.yml'
permissions:
  contents: write
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install integrity-checked responsive bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          # Recover the prepared installer and correct one transcription byte.
          prepared = subprocess.check_output(['git', 'show', '98281e408163a0626aec5e14a0a9f35218c939f9:.github/workflows/mobile-responsive-v15.yml'], text=True)
          script = prepared.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          script = textwrap.dedent(script)
          assert script.count('I9dcowPvh') == 1
          script = script.replace('I9dcowPvh', 'I9cowPvh')
          # The installer's SHA-256 check must pass before it writes any file.
          exec(compile(script, 'verified-mobile-installer', 'exec'), {})
          PY
      - name: Validate JavaScript and all three pages
        run: |
          node --check assets/responsive.js
          node --check assets/search-v2.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {'assets/responsive.css': 'd4f21fb719783829293cb082eb99bc35e1d43c3035dadbf7edc125eb1eac5f62', 'assets/responsive.js': '2e68ca497c0f14dc77a8b65798f29c08fffab010bcbb6d4d3d4d872a9f5020e1'}
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest
          for name in ['index.html', 'index-en.html', 'index-hi.html']:
              text = Path(name).read_text(encoding='utf-8')
              assert text.count('assets/responsive.css?v=20260917-mobile-1') == 1
              assert text.count('assets/responsive.js?v=20260917-mobile-1') == 1
              assert 'name="viewport"' in text
          print('Tested asset hashes and RU / EN / HI includes match.')
          PY
      - name: Commit responsive layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css assets/responsive.js index.html index-en.html index-hi.html docs/responsive-checks.md .github/workflows/mobile-responsive-v15.yml
          git commit -m 'feat: responsive mobile and tablet layout for RU EN HI'
          git push
