name: Live Tutu destination directory audit

on:
  pull_request:
    paths:
      - 'assets/tour-catalog.js'
      - 'scripts/audit-tour-directory.py'
      - 'scripts/probe-winter-pairs.py'
      - 'scripts/probe-public-tour-url-formats.py'
      - 'scripts/probe-public-travelata-directory.py'
      - '.github/workflows/tour-directory-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare catalog links with live official Tutu directories
        run: |
          mkdir -p /tmp/tutu-tour-audit
          python scripts/audit-tour-directory.py --output /tmp/tutu-tour-audit/directory-audit.json
      - name: Check public Travelata link-constructor for verified metadata
        continue-on-error: true
        run: python scripts/probe-public-travelata-directory.py
      - name: Audit 28 winter city-to-resort SEO links
        continue-on-error: true
        run: python scripts/probe-winter-pairs.py /tmp/tutu-tour-audit/winter-route-candidates.json
      - name: Inspect public Travelata link constructor script syntax
        continue-on-error: true
        run: python scripts/probe-public-tour-url-formats.py /tmp/tutu-tour-audit/public-resort-url-formats.json
      - name: Archive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-tutu-directory-audit
          path: /tmp/tutu-tour-audit/
          if-no-files-found: warn
