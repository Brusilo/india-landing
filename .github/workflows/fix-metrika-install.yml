name: Fix Yandex Metrika installation

on:
  push:
    paths:
      - '.github/workflows/fix-metrika-install.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Metrika on all language pages
        shell: python
        run: |
          from pathlib import Path
          import re

          counter = '112759004'
          script = '''<!-- Yandex.Metrika counter -->
          <script type="text/javascript">
              (function(m,e,t,r,i,k,a){
                  m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
                  m[i].l=1*new Date();
                  for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
                  k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
              })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=112759004', 'ym');

              ym(112759004, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
          </script>
          <!-- /Yandex.Metrika counter -->'''

          noscript = '''<!-- Yandex.Metrika counter (noscript) -->
          <noscript><div><img src="https://mc.yandex.ru/watch/112759004" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
          <!-- /Yandex.Metrika counter (noscript) -->'''

          for filename in ['index.html', 'index-en.html', 'index-hi.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              # Remove any prior inline copy if this workflow is ever re-run.
              text = re.sub(r'\n?<!-- Yandex\.Metrika counter -->.*?<!-- /Yandex\.Metrika counter -->\n?', '\n', text, flags=re.S)
              text = re.sub(r'\n?<!-- Yandex\.Metrika counter \(noscript\) -->.*?<!-- /Yandex\.Metrika counter \(noscript\) -->\n?', '\n', text, flags=re.S)

              # Keep charset/viewport first, then load Metrika as early as practical.
              viewport = re.search(r'(<meta\s+name=["\']viewport["\'][^>]*>)', text, flags=re.I)
              if not viewport:
                  raise RuntimeError(f'viewport meta not found in {filename}')
              pos = viewport.end()
              text = text[:pos] + '\n' + script + text[pos:]

              # noscript must live in body.
              body = re.search(r'<body[^>]*>', text, flags=re.I)
              if not body:
                  raise RuntimeError(f'body not found in {filename}')
              pos = body.end()
              text = text[:pos] + '\n' + noscript + text[pos:]

              # Bust cache for responsive.js because its previous version contained Metrika.
              text = text.replace('assets/responsive.js?v=20260917-mobile-1', 'assets/responsive.js?v=20260917-metrika-2')
              p.write_text(text, encoding='utf-8')

          # Remove the previous shared-script Metrika bootstrap to avoid double initialization.
          rp = Path('assets/responsive.js')
          responsive = rp.read_text(encoding='utf-8')
          marker = '/* Progressive mobile controls. Original nodes and the desktop DOM are restored on resize. */'
          if marker not in responsive:
              raise RuntimeError('responsive.js marker not found')
          responsive = responsive[responsive.index(marker):]
          rp.write_text(responsive, encoding='utf-8')

          # Safety checks.
          for filename in ['index.html', 'index-en.html', 'index-hi.html']:
              text = Path(filename).read_text(encoding='utf-8')
              assert text.count("ym(112759004, 'init'") == 1, filename
              assert text.count('https://mc.yandex.ru/watch/112759004') == 1, filename
              assert 'assets/responsive.js?v=20260917-metrika-2' in text, filename
          assert '112759004' not in rp.read_text(encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html assets/responsive.js
          git diff --cached --check
          git commit -m "Install Yandex Metrika on all language pages"
          git push
