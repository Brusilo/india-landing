name: Verify destination corrections
on:
  push:
    paths:
      - '.github/workflows/landing-verify-corrections-v25.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export local city labels
        run: |
          mkdir -p correction-audit
          node -e "const fs=require('fs'),vm=require('vm');const c={window:{}};vm.createContext(c);vm.runInContext(fs.readFileSync('assets/search-places.js','utf8'),c);fs.writeFileSync('correction-audit/places.json',JSON.stringify(c.window.TUTU_PLACES.places))"
      - name: Validate candidate paths and read published city directories
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re,time,concurrent.futures,http.client
          from pathlib import Path
          from html.parser import HTMLParser
          # These are test candidates, not approved production URL mappings.
          flight='''ru-gelendzhik=Gelendjik;ru-cherepovets=Cherepovec;ru-lipetsk=Lipeck;ru-voronezh=Voronej;ru-cheboksary=Cheboksari;ru-izhevsk=Ijevsk;ru-novokuznetsk=Novokuzneck;ru-kyzyl=Kizil;ru-nizhnevartovsk=Nijnevartovsk;ru-khanty-mansiysk=Hanti-mansiysk;ru-novy-urengoy=Noviy_urengoy;ru-salekhard=Salehard;ru-nadym=Nadim;ru-kogalym=Kogalim;ru-blagoveshchensk=Blagoveschensk;ru-mirny=Mirniy;ru-anadyr=Anadir;ru-yuzhno-sakhalinsk=Yujno-sahalinsk;ru-komsomolsk-on-amur=Komsomolsk-na-amure;ru-nikolaevsk-on-amur=Nikolaevsk-na-amure;ru-sovetskaya-gavan=Sovetskaya_gavan;ru-tynda=Tinda;ru-arkhangelsk=Arhangelsk;ru-syktyvkar=Siktivkar;ru-ukhta=Uhta;ru-nizhnekamsk=Nijnekamsk;ru-veliky-ustyug=Velikiy_ustyug;in-indore=Indaur;in-raipur=Raypur;in-tiruchirappalli=Tiruchirapalli;in-thiruvananthapuram=Trivandram;kz-almaty=Alma-ata;kz-shymkent=Shimkent;kz-atyrau=Atirau;kz-kyzylorda=Kizilorda;kz-petropavl=Petropavlovsk;kz-turkistan=Turkestan;kz-oral=Uralsk;kz-oskemen=Ust-kamenogorsk;kz-zhezkazgan=Jezkazgan;kz-balkhash=Balhash;kz-baikonur=Baykonur;kz-taldykorgan=Taldikorgan;kz-urzhar=Urdjar;uz-bukhara=Buhara;uz-qarshi=Karshi;kg-issyk-kul=Issik-kul;tj-khujand=Hudjand;tj-kulob=Kulyab;tj-bokhtar=Kurgan-tyube;az-ganja=Gyandja;az-nakhchivan=Nahichevan;az-lankaran=Lenkoran;az-zaqatala=Zakatali;by-mogilev=Mogilyov;md-chisinau=Kishinev;tm-ashgabat=Ashhabad;tm-turkmenabat=Turkmenabad;tm-mary=Mari;cn-beijing=Pekin;cn-shanghai=Shanhay;cn-guangzhou=Guanchjou;cn-shenzhen=Shenchjen;cn-haikou=Haykou;cn-chengdu=Chendu;cn-urumqi=Urumchi;cn-manzhouli=Manchjuriya;ae-abu-dhabi=Abu-dabi;ae-sharjah=Shardja;kz-semey=Semey;kz-kokshetau=Kokshetau'''
          rail='''ru-khabarovsk=Habarovsk;kz-oral=Uralsk;kz-oskemen=Ust-Kamenogorsk;ru-arkhangelsk=Arhangelsk;ru-lazarevskoye=Lazarevskaya;am-yerevan=Erevan;ru-yessentuki=Essentuki;ru-novy-urengoy=Novyy-Urengoi'''
          cases=[]
          for mode,data,prefix in [('flight',flight,'https://avia.tutu.ru/f/Moskva/'),('train',rail,'https://www.tutu.ru/poezda/Moskva/')]:
            for entry in data.split(';'):
              id,slug=entry.split('=');cases.append({'id':id,'mode':mode,'slug':slug,'url':prefix+slug+'/'})
          for c in ['russia','india','kazakhstan','belarus','uzbekistan','kirgizstan','tadjikistan','turkmenistan','moldova']:
            cases.append({'id':c,'mode':'hotel-catalog','url':f'https://hotel.tutu.ru/c_{c}/cities/'})
          for id,slug in [('ru-sochi','Sochi'),('ru-yekaterinburg','Ekaterinburg'),('ru-novosibirsk','Novosibirsk'),('ru-samara','Samara'),('ru-krasnodar','Krasnodar'),('ru-anapa','Anapa'),('ru-adler','Adler')]:
            cases.append({'id':id,'mode':'bus','url':'https://bus.tutu.ru/raspisanie/gorod_Moskva/gorod_'+slug+'/'})
          cases.append({'id':'ufa-kazan','mode':'bus-query','url':'https://bus.tutu.ru/raspisanie/gorod_Ufa/gorod_Kazan/?from=1333152&to=1330021&date=20.09.2026&travelers=2.6&amount=3'})
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.items=[];self.link=None
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.link={'href':dict(attrs).get('href',''),'text':''}
            def handle_data(self,data):
              if self.link:self.link['text']+=data
            def handle_endtag(self,tag):
              if tag=='a' and self.link:self.items.append(self.link);self.link=None
          def read(case):
            row=dict(case)
            try:
              req=urllib.request.Request(case['url'],headers={'User-Agent':'Mozilla/5.0 (compatible; LandingLinkSmokeTest/1.0)'})
              with urllib.request.urlopen(req,timeout=7) as r:
                try:data=r.read(7000000)
                except http.client.IncompleteRead as e:data=e.partial;row['incomplete']=True
                text=data.decode('utf-8','replace');row.update(status=r.status,final_url=r.url)
                t=re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I);row['title']=t.group(1) if t else ''
                if case['mode']=='flight':
                  for key in ['arrivalCityId','arrivalCity','arrivalCityTranslit']:
                    m=re.search(r'"'+key+r'"\s*:\s*"([^"]+)"',text)
                    if m:row[key]=m.group(1)
                elif case['mode'].startswith('bus'):
                  m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',text,re.S)
                  if m:
                    x=json.loads(m.group(1));row['page']=x.get('page');row['query']=x.get('query')
                    actions=x['props']['pageProps'].get('reduxWrapperActionsGSSP',[])
                    row['actions']=[a for a in actions if a['type'] in ['searchForm/setSearchFrom','searchForm/setSearchTo','root/setGeoPoints']]
                elif case['mode']=='hotel-catalog':
                  parser=Links();parser.feed(text);row['links']=parser.items
                Path('correction-audit/'+case['mode']+'-'+case['id']+'.html').write_text(text,encoding='utf-8')
            except Exception as e:
              row['error']=str(e)
              if hasattr(e,'code'):row['status']=e.code
            time.sleep(.3);return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(read,cases))
          Path('correction-audit/results.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf-8')
          print([(r['id'],r['mode'],r.get('status'),r.get('arrivalCity')) for r in results])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-correction-audit-v25
          path: correction-audit/
          retention-days: 1
