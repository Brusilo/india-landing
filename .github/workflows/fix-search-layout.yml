name: Fix search layout

on:
  push:
    paths:
      - '.github/workflows/fix-search-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply layout fixes
        run: python3 .github/scripts/fix_search_layout.py

      - name: Validate
        shell: bash
        run: |
          node --check assets/search-v2.js
          grep -q 'max-height: none' assets/search-v2.css
          grep -q 'overflow: visible' assets/search-v2.css
          grep -q 'minmax(145px, .55fr)' assets/search-v2.css
          grep -q 'minmax(250px, 1.05fr)' assets/search-v2.css
          grep -q 'hints.dataset.mode=mode' assets/search-v2.js
          grep -q "input.addEventListener('click'" assets/search-v2.js
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/search-v2.css assets/search-v2.js
          git commit -m "Fix search dropdown and hint alignment"
          git push origin HEAD:main
