name: Verify multilingual search persistence

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/search-state.js'
      - 'assets/search-v2.js'
      - 'assets/tour-form.js'
      - 'assets/tour-catalog.js'
      - 'tests/landing-tours.cjs'
      - 'index.html'
      - 'index-ru.html'
      - 'index-hi.html'
      - 'tests/test-search-language.py'
      - '.github/workflows/test-search-language.yml'
      - 'tests/landing-audit.py'
      - 'tests/landing-interactions.py'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Travelata tour links, including children (offline)
        run: node tests/landing-tours.cjs
      - name: Verify city and route link catalog (offline)
        run: node tests/landing-data.cjs
      - name: Verify quoted prices, promos and currency logic (offline)
        run: node tests/landing-pricing.cjs
      - name: Verify supplier and exchange-rate parsing against fixtures (offline)
        run: |
          python scripts/update-market-data.py --self-test
          python scripts/scrape-public-prices.py --self-test
      - name: Install Chromium for browser regression tests
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run local landing and verify RU / EN / HI state
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/india-landing-web.log 2>&1 &
          python tests/test-search-language.py
          python tests/landing-audit.py
          python tests/landing-interactions.py
      - name: Upload full QA report and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-qa-report
          path: reports/
          if-no-files-found: ignore
