name: Raise suitcase slightly

on:
  push:
    paths:
      - '.github/workflows/raise-suitcase-slightly.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raise suitcase in all language versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('index-en.html'), Path('index-hi.html')]
          replacements = [
              ('top:8px!important;', 'top:-12px!important;'),
              ('top:12px!important;bottom:auto!important}', 'top:-8px!important;bottom:auto!important}'),
              ('top:40px!important;bottom:auto!important;opacity:.82!important}', 'top:20px!important;bottom:auto!important;opacity:.82!important}'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected suitcase position not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          grep -q 'top:-12px!important;' index.html
          grep -q 'top:-8px!important;bottom:auto!important}' index.html
          grep -q 'top:20px!important;bottom:auto!important;opacity:.82!important}' index.html
          grep -q 'top:-12px!important;' index-en.html
          grep -q 'top:-12px!important;' index-hi.html
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          git commit -m "Raise suitcase slightly across language versions"
          git push origin HEAD:main
