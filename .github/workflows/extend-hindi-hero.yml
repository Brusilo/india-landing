name: Extend Hindi hero

on:
  push:
    paths:
      - '.github/workflows/extend-hindi-hero.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add extra blue space to Hindi hero
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index-hi.html'); t=p.read_text(encoding='utf-8'); m='</style>'; x='\\n/* Hindi hero breathing room */\\nhtml:lang(hi) .hero{padding-bottom:132px!important}\\n@media(min-width:768px){html:lang(hi) .hero{padding-bottom:176px!important}}\\n'; assert x.strip() not in t; assert m in t; p.write_text(t.replace(m,x+m,1),encoding='utf-8')"
      - name: Validate
        shell: bash
        run: |
          grep -q 'html:lang(hi) .hero{padding-bottom:132px!important}' index-hi.html
          grep -q 'padding-bottom:176px!important' index-hi.html
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-hi.html
          git commit -m "Extend Hindi hero blue space"
          git push origin HEAD:main
