name: Bump date placeholder cache

on:
  push:
    paths:
      - '.github/workflows/bump-date-placeholder-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump CSS version
        run: sed -i -E 's#assets/search-v2\.css\?v=[^" ]+#assets/search-v2.css?v=20260917-date-placeholder-all#g' index.html index-en.html index-hi.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-date-placeholder-cache.yml
          git add index.html index-en.html index-hi.html
          git commit -m "Bump search CSS for date placeholder fix"
          git push origin HEAD:main
