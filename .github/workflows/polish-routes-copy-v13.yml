name: Polish route section and payment copy v13

on:
  push:
    paths:
      - '.github/workflows/polish-routes-copy-v13.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply spacing and copy changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          css_path = root / 'assets/search-v2.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Route section spacing after removing transport filters. */'
          if marker not in css:
              css += '\n\n' + marker + '\n#routes .section-head { margin-top: 16px; }\n'
          css_path.write_text(css, encoding='utf-8')

          removals = {
              'index.html': ' Индийские карты Visa и Mastercard, а также платёжные системы UPI и RuPay сервисом не принимаются.',
              'index-en.html': ' Indian Visa and Mastercard cards, UPI and RuPay are not accepted.',
              'index-hi.html': ' भारतीय Visa और Mastercard कार्ड, UPI और RuPay स्वीकार नहीं किए जाते।',
          }

          for fn, sentence in removals.items():
              p = root / fn
              h = p.read_text(encoding='utf-8')
              h = h.replace(sentence, '')
              h = re.sub(r'assets/search-v2\.css\?v=[^\"\']+', 'assets/search-v2.css?v=20260917-routes-copy-13', h)
              p.write_text(h, encoding='utf-8')

          wf = root / '.github/workflows/polish-routes-copy-v13.yml'
          if wf.exists():
              wf.unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          grep -Fq '#routes .section-head { margin-top: 16px; }' assets/search-v2.css
          for f in index.html index-en.html index-hi.html; do
            grep -Fq 'assets/search-v2.css?v=20260917-routes-copy-13' "$f"
            if grep -Eq 'UPI|RuPay' "$f"; then
              echo "Payment warning still present in $f"
              exit 1
            fi
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lower routes heading and trim payment copy'
          git push
