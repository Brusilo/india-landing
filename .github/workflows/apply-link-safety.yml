name: Apply Tutu link safety

on:
  push:
    paths:
      - '.github/workflows/apply-link-safety.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/patch_link_safety.py
      - name: Validate
        run: |
          node --check assets/search-v2.js
          node --check assets/tutu-link-builder.js
          grep -q 'TUTU_LINKS.supports(mode,p)' assets/search-v2.js
          grep -q 'tutu-links-2' index.html
          grep -q 'tutu-links-2' index-en.html
          grep -q 'tutu-links-2' index-hi.html
          node <<'NODE'
          global.window={};
          require('./assets/tutu-link-builder.js');
          const L=window.TUTU_LINKS;
          const p=(id,country,canonical,ru)=>({id,country,canonical,name:{ru}});
          const d=(y,m,day)=>new Date(y,m-1,day);
          const sochi=p('ru-sochi','RU','Sochi','Сочи');
          const moscow=p('ru-moscow','RU','Moscow','Москва');
          const kazan=p('ru-kazan','RU','Kazan','Казань');
          const gel=p('ru-gelendzhik','RU','Gelendzhik','Геленджик');
          const dubai=p('ae-dubai','AE','Dubai','Дубай');
          let u=L.build('flight',{from:sochi,to:moscow,date:d(2026,9,18),adults:3,children:0,childAges:[],cabin:'economy'});
          if(!u.includes('/f/Sochi/Moskva/')||!u.includes('route%5B0%5D=78-18092026-491'))throw new Error(u);
          u=L.build('train',{from:kazan,to:moscow,date:d(2026,9,20),adults:3,children:1,childAges:[6]});
          if(u!=='https://www.tutu.ru/poezda/Kazan/Moskva/?date=20.09.2026&travelers=3.6')throw new Error(u);
          u=L.build('bus',{from:moscow,to:gel,date:d(2026,9,18),adults:3,children:0,childAges:[]});
          if(u!=='https://www.tutu.ru/poezda/Moskva/Gelendzhik/?date=18.09.2026&travelers=3')throw new Error(u);
          u=L.build('hotel',{destination:dubai,start:d(2026,9,20),end:d(2026,9,22),adults:2,children:0,childAges:[]});
          if(!u.includes('/c_united_arab_emirates/dubai/'))throw new Error(u);
          console.log('Tutu URL smoke tests passed');
          NODE
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-link-safety.yml tools/patch_link_safety.py
          git add assets/search-v2.js index.html index-en.html index-hi.html
          git commit -m "Filter search by Tutu link support"
          git push origin HEAD:main
