name: Refresh verified hotel prices v10

on:
  push:
    paths:
      - '.github/workflows/refresh-hotel-prices-v10.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh hotel prices and metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/card-links.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "meta:{ru:'Отель · 214 отзывов',en:'Hotel · 214 reviews',hi:'होटल · 214 समीक्षाएँ'},rating:'8,3',price:1833":"meta:{ru:'Отель · 214 отзывов',en:'Hotel · 214 reviews',hi:'होटल · 214 समीक्षाएँ'},rating:'8,3',price:3584",
            "meta:{ru:'Отель',en:'Hotel',hi:'होटल'},rating:'9,1',price:3275":"meta:{ru:'Гостевой дом · 240 отзывов',en:'Guest house · 240 reviews',hi:'गेस्ट हाउस · 240 समीक्षाएँ'},rating:'9,1',price:2300",
            "meta:{ru:'Хостел',en:'Hostel',hi:'हॉस्टल'},rating:'8,4',price:1172":"meta:{ru:'Хостел · 336 отзывов',en:'Hostel · 336 reviews',hi:'हॉस्टल · 336 समीक्षाएँ'},rating:'8,4',price:3178",
            "meta:{ru:'Отель · 158 отзывов',en:'Hotel · 158 reviews',hi:'होटल · 158 समीक्षाएँ'},rating:'7,8',price:2062":"meta:{ru:'Отель · 157 отзывов',en:'Hotel · 157 reviews',hi:'होटल · 157 समीक्षाएँ'},rating:'7,8',price:2199",
            "meta:{ru:'Апартаменты',en:'Apartments',hi:'अपार्टमेंट'},rating:'',price:3227":"meta:{ru:'Апартаменты',en:'Apartments',hi:'अपार्टमेंट'},rating:'',price:2400"
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          for fn in ['index.html','index-en.html','index-hi.html']:
              p=Path(fn); h=p.read_text(encoding='utf-8')
              assert 'assets/card-links.js?v=20260917-links-9' in h
              h=h.replace('assets/card-links.js?v=20260917-links-9','assets/card-links.js?v=20260917-links-10')
              p.write_text(h,encoding='utf-8')

          wf=Path('.github/workflows/refresh-hotel-prices-v10.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          node --check assets/card-links.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/card-links.js').read_text(encoding='utf-8')
          for x in ['price:3584','price:2300','price:3178','price:2199','price:2400','price:2500']:
              assert x in s,x
          for fn in ['index.html','index-en.html','index-hi.html']:
              assert 'assets/card-links.js?v=20260917-links-10' in Path(fn).read_text(encoding='utf-8')
          print('v10 hotel price validation OK')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh verified hotel prices v10'
          git push
