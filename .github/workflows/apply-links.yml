name: Mount decorative artwork

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert decorative images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('index.html','index-en.html','index-hi.html'):
            p=Path(filename); text=p.read_text(encoding='utf-8')
            if '<img class="hero-decor hero-decor--suitcase"' not in text:
              text=text.replace('<section class="hero">','<section class="hero">\n  <img class="hero-decor hero-decor--suitcase" src="assets/decor-suitcase.svg" alt="" aria-hidden="true">',1)
            if '<img class="section-decor section-decor--ticket"' not in text:
              text=text.replace('<section class="section" id="routes">','<section class="section" id="routes">\n  <img class="section-decor section-decor--ticket" src="assets/decor-ticket.svg" alt="" aria-hidden="true">',1)
            if '<img class="section-decor section-decor--keys"' not in text:
              text=text.replace('<section class="section" id="hotels">','<section class="section" id="hotels">\n  <img class="section-decor section-decor--keys" src="assets/decor-keys.svg" alt="" aria-hidden="true">',1)
            p.write_text(text,encoding='utf-8')
          PY
      - name: Commit artwork placement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then echo "No changes to commit"; else git commit -m "fix: place decorative artwork" && git push; fi
