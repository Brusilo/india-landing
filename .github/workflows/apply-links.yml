name: Apply localized copy updates

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible hero copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hero = {
              'index.html': 'Автобусы, поезда и самолёты по всей стране. И международные рейсы обратно домой.',
              'index-en.html': 'Buses, trains and flights across the country, plus international flights back home.',
              'index-hi.html': 'पूरे देश में बस, ट्रेन और फ़्लाइट — और घर वापसी के लिए अंतरराष्ट्रीय उड़ानें।',
          }

          for filename, new_text in hero.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'(<p class="hero-sub">).*?(</p>)', lambda m: m.group(1) + new_text + m.group(2), text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'hero-sub not found in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit updated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "copy: update visible hero messaging"
            git push
          fi
