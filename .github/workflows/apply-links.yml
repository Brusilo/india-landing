name: Apply transport search UI

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-search-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild transport search controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          locales = {
            'index.html': {
              'swap':'Поменять местами', 'from':'Откуда', 'to':'Куда', 'date':'Когда',
              'pax_caption':'Кто едет', 'one':'1 пассажир', 'search':'Найти авиабилеты',
              'adult':'Взрослые', 'adult_sub':'От 12 лет', 'child':'Дети', 'child_sub':'До 12 лет',
              'class':'Класс обслуживания', 'economy':'Эконом', 'business':'Бизнес',
              'flight_search':'Найти авиабилеты', 'train_search':'Найти поезда', 'bus_search':'Найти автобусы',
              'flight_from':'Город или аэропорт', 'flight_to':'Город или аэропорт',
              'train_from':'Город или вокзал', 'train_to':'Город или вокзал',
              'bus_from':'Город или автовокзал', 'bus_to':'Город или автовокзал',
              'flight':[('Москва','Все аэропорты · MOW'),('Санкт-Петербург','Пулково · LED'),('Казань','Аэропорт Казань · KZN'),('Дели','Indira Gandhi · DEL'),('Мумбаи','Chhatrapati Shivaji · BOM')],
              'train':[('Москва','Ленинградский вокзал'),('Москва','Казанский вокзал'),('Санкт-Петербург','Московский вокзал'),('Казань','Казань-Пасс.'),('Тверь','Ж/д вокзал')],
              'bus':[('Москва','Центральный автовокзал'),('Санкт-Петербург','Автовокзал на Обводном'),('Казань','Восточный автовокзал'),('Уфа','Южный автовокзал'),('Тверь','Автовокзал')],
            },
            'index-en.html': {
              'swap':'Swap places', 'from':'From', 'to':'To', 'date':'Date',
              'pax_caption':'Passengers', 'one':'1 passenger', 'search':'Find flights',
              'adult':'Adults', 'adult_sub':'Age 12+', 'child':'Children', 'child_sub':'Under 12',
              'class':'Travel class', 'economy':'Economy', 'business':'Business',
              'flight_search':'Find flights', 'train_search':'Find trains', 'bus_search':'Find buses',
              'flight_from':'City or airport', 'flight_to':'City or airport',
              'train_from':'City or station', 'train_to':'City or station',
              'bus_from':'City or bus station', 'bus_to':'City or bus station',
              'flight':[('Moscow','All airports · MOW'),('Saint Petersburg','Pulkovo · LED'),('Kazan','Kazan Airport · KZN'),('Delhi','Indira Gandhi · DEL'),('Mumbai','Chhatrapati Shivaji · BOM')],
              'train':[('Moscow','Leningradsky station'),('Moscow','Kazansky station'),('Saint Petersburg','Moskovsky station'),('Kazan','Kazan-Pass.'),('Tver','Railway station')],
              'bus':[('Moscow','Central Bus Station'),('Saint Petersburg','Obvodny Bus Station'),('Kazan','Vostochny Bus Station'),('Ufa','South Bus Station'),('Tver','Bus Station')],
            },
            'index-hi.html': {
              'swap':'स्थान बदलें', 'from':'कहाँ से', 'to':'कहाँ तक', 'date':'तारीख़',
              'pax_caption':'यात्री', 'one':'1 यात्री', 'search':'फ़्लाइट खोजें',
              'adult':'वयस्क', 'adult_sub':'12 साल और अधिक', 'child':'बच्चे', 'child_sub':'12 साल से कम',
              'class':'यात्रा श्रेणी', 'economy':'इकोनॉमी', 'business':'बिज़नेस',
              'flight_search':'फ़्लाइट खोजें', 'train_search':'ट्रेन खोजें', 'bus_search':'बस खोजें',
              'flight_from':'शहर या एयरपोर्ट', 'flight_to':'शहर या एयरपोर्ट',
              'train_from':'शहर या स्टेशन', 'train_to':'शहर या स्टेशन',
              'bus_from':'शहर या बस स्टेशन', 'bus_to':'शहर या बस स्टेशन',
              'flight':[('मॉस्को','सभी एयरपोर्ट · MOW'),('सेंट पीटर्सबर्ग','पुल्कोवो · LED'),('कज़ान','कज़ान एयरपोर्ट · KZN'),('दिल्ली','इंदिरा गांधी · DEL'),('मुंबई','छत्रपति शिवाजी · BOM')],
              'train':[('मॉस्को','लेनिनग्राद्स्की स्टेशन'),('मॉस्को','कज़ान्स्की स्टेशन'),('सेंट पीटर्सबर्ग','मॉस्कोव्स्की स्टेशन'),('कज़ान','कज़ान-पास.'),('त्वेर','रेलवे स्टेशन')],
              'bus':[('मॉस्को','सेंट्रल बस स्टेशन'),('सेंट पीटर्सबर्ग','ओब्वोद्नी बस स्टेशन'),('कज़ान','वोस्तोच्नी बस स्टेशन'),('ऊफ़ा','साउथ बस स्टेशन'),('त्वेर','बस स्टेशन')],
            },
          }

          css = r'''
/* Compact transport search */
.search{
  position:relative;width:min(100%,1080px);margin-top:20px;padding:0;
  display:grid;grid-template-columns:minmax(180px,1.05fr) 48px minmax(180px,1.05fr) minmax(150px,.8fr) minmax(190px,.9fr) 190px;
  align-items:stretch;background:var(--white);border-radius:16px;box-shadow:var(--shadow-md);overflow:visible;
}
.search .field{position:relative;min-width:0;min-height:64px;padding:0;border:0;border-right:1px solid var(--line);background:var(--white);display:flex;justify-content:center}
.search .field:first-child{border-radius:16px 0 0 16px}
.search .field input{height:64px;padding:0 18px;font-size:16px;font-weight:500;color:var(--deep-blue);background:transparent}
.search .field input::placeholder{color:#62627A;font-weight:500;opacity:1}
.search .field--date input{cursor:pointer}
.search .swap{width:48px;display:grid;place-items:center;background:var(--white);border-right:1px solid var(--line);align-self:stretch}
.search .swap span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:transparent}
.search .swap:hover span{background:var(--cloud-white)}
.search .swap svg{width:20px;height:20px;stroke:#89899D;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search .field--pax{padding:0;flex:none}
.pax-trigger{width:100%;height:64px;padding:8px 16px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pax-caption{font-size:12px;line-height:1.1;color:var(--muted);font-weight:500}
.pax-value{font-size:16px;line-height:1.25;color:var(--deep-blue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-search{margin:0;height:64px;border-radius:0 16px 16px 0;background:#6F29E8;color:#fff;font-size:16px;font-weight:700;display:grid;place-items:center;padding:0 18px;white-space:nowrap}
.btn-search:hover{filter:brightness(1.04)}
.search-suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:45;background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(13,11,104,.18);padding:8px;max-height:300px;overflow:auto}
.search-suggest[hidden]{display:none}
.suggest-item{width:100%;padding:11px 12px;border-radius:11px;text-align:left;display:flex;flex-direction:column;gap:2px}
.suggest-item:hover,.suggest-item.is-active{background:var(--cloud-white)}
.suggest-main{font-size:15px;font-weight:600;color:var(--deep-blue)}
.suggest-meta{font-size:12px;color:var(--muted)}
.pax-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:360px;max-width:calc(100vw - 32px);padding:18px;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(13,11,104,.2);color:var(--deep-blue)}
.pax-pop[hidden]{display:none}
.pax-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0}
.pax-copy{min-width:0}.pax-name{font-size:16px;font-weight:700}.pax-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:42px;height:42px;border-radius:12px;background:#F1F1F6;font-size:25px;line-height:1;color:var(--deep-blue)}
.stepper button:disabled{opacity:.35;cursor:default}.stepper output{width:24px;text-align:center;font-size:18px;font-weight:600}
.add-child{margin:8px 0 4px;width:100%;height:46px;border-radius:12px;background:#F0E8FF;color:#6F29E8;font-weight:600;display:none;align-items:center;justify-content:center;gap:8px}
.add-child.is-visible{display:flex}
.cabin{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.cabin-title{font-size:13px;color:var(--muted);margin-bottom:8px}
.cabin-tabs{display:grid;grid-template-columns:1fr 1fr;background:#F0F0F6;border-radius:12px;padding:4px;gap:4px}
.cabin-tabs button{height:38px;border-radius:9px;color:#77778C;font-weight:600}
.cabin-tabs button.is-active{background:#fff;color:var(--deep-blue);box-shadow:0 1px 4px rgba(13,11,104,.08)}
@media(max-width:899px){
  .search{width:100%;display:flex;flex-direction:column;border-radius:16px;overflow:visible}
  .search .field,.search .swap{border-right:0;border-bottom:1px solid var(--line)}
  .search .field:first-child{border-radius:16px 16px 0 0}.search .swap{display:none}
  .search .field input,.pax-trigger{height:58px}.btn-search{height:54px;border-radius:0 0 16px 16px}
  .pax-pop{left:0;right:auto}
}
'''

          def form_html(t):
            return f'''<form class="search" onsubmit="return false">
      <div class="field field--place" data-kind="from">
        <input id="f-from" type="text" placeholder="{t['flight_from']}" aria-label="{t['from']}" autocomplete="off">
        <div class="search-suggest" hidden></div>
      </div>
      <button class="swap" type="button" aria-label="{t['swap']}">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 4 7l3 3M4 7h13M17 20l3-3-3-3M20 17H7"/></svg></span>
      </button>
      <div class="field field--place" data-kind="to">
        <input id="f-to" type="text" placeholder="{t['flight_to']}" aria-label="{t['to']}" autocomplete="off">
        <div class="search-suggest" hidden></div>
      </div>
      <div class="field field--date">
        <input id="f-date" type="text" placeholder="{t['date']}" aria-label="{t['date']}" autocomplete="off">
      </div>
      <div class="field field--pax">
        <button type="button" class="pax-trigger" aria-haspopup="dialog" aria-expanded="false">
          <span class="pax-caption">{t['pax_caption']}</span>
          <span class="pax-value">{t['one']}, {t['economy'].lower() if t is locales['index.html'] else t['economy']}</span>
        </button>
        <div class="pax-pop" role="dialog" hidden></div>
      </div>
      <button type="button" class="btn-search">{t['search']}</button>
    </form>'''

          for filename, t in locales.items():
            path=Path(filename)
            text=path.read_text(encoding='utf-8')
            text=text.replace('</style>', css+'\n</style>', 1)
            pattern=r'<form class="search" onsubmit="return false">.*?</form>\s*<div class="chips">.*?</div>'
            text,n=re.subn(pattern, form_html(t), text, count=1, flags=re.S)
            if n!=1: raise RuntimeError(f'search form not replaced in {filename}')

            data_js = {
              'flight': t['flight'], 'train': t['train'], 'bus': t['bus']
            }
            import json
            js_data=json.dumps(data_js, ensure_ascii=False)
            js_labels=json.dumps({k:t[k] for k in ['flight_search','train_search','bus_search','flight_from','flight_to','train_from','train_to','bus_from','bus_to','pax_caption','one','adult','adult_sub','child','child_sub','class','economy','business']}, ensure_ascii=False)
            new_js = f'''(function(){{
  const transportButtons=[...document.querySelectorAll('.transport button')];
  const modeByIndex=['hotel','flight','train','bus'];
  const places={js_data};
  const L={js_labels};
  const from=document.getElementById('f-from');
  const to=document.getElementById('f-to');
  const searchBtn=document.querySelector('.btn-search');
  const swap=document.querySelector('.search .swap');
  const paxTrigger=document.querySelector('.pax-trigger');
  const paxValue=document.querySelector('.pax-value');
  const paxPop=document.querySelector('.pax-pop');
  let mode='flight';
  let adults=1, children=0, cabin='economy';

  const plural=(n)=>{{
    const lang=document.documentElement.lang;
    if(lang==='ru'){{const m=n%10,d=n%100;return d>=11&&d<=14?'пассажиров':m===1?'пассажир':m>=2&&m<=4?'пассажира':'пассажиров';}}
    if(lang==='en') return n===1?'passenger':'passengers';
    return 'यात्री';
  }};
  function updatePaxValue(){{
    const total=adults+children;
    let s=`${{total}} ${{plural(total)}}`;
    if(mode==='flight') s+=`, ${{cabin==='economy'?L.economy:L.business}}`;
    paxValue.textContent=s;
  }}
  function renderPax(){{
    const showChildButton=children===0;
    paxPop.innerHTML=`
      <div class="pax-row"><div class="pax-copy"><div class="pax-name">${{L.adult}}</div><div class="pax-sub">${{L.adult_sub}}</div></div><div class="stepper"><button type="button" data-pax="adult" data-step="-1">−</button><output>${{adults}}</output><button type="button" data-pax="adult" data-step="1">+</button></div></div>
      <button type="button" class="add-child ${{showChildButton?'is-visible':''}}" data-add-child>＋ ${{L.child}}</button>
      ${{children>0?`<div class="pax-row"><div class="pax-copy"><div class="pax-name">${{L.child}}</div><div class="pax-sub">${{L.child_sub}}</div></div><div class="stepper"><button type="button" data-pax="child" data-step="-1">−</button><output>${{children}}</output><button type="button" data-pax="child" data-step="1">+</button></div></div>`:''}}
      <div class="cabin" ${{mode==='flight'?'':'hidden'}}><div class="cabin-title">${{L.class}}</div><div class="cabin-tabs"><button type="button" data-cabin="economy" class="${{cabin==='economy'?'is-active':''}}">${{L.economy}}</button><button type="button" data-cabin="business" class="${{cabin==='business'?'is-active':''}}">${{L.business}}</button></div></div>`;
    paxPop.querySelectorAll('[data-step]').forEach(b=>{{
      const type=b.dataset.pax, step=Number(b.dataset.step), total=adults+children;
      if(type==='adult'&&step<0&&adults<=1)b.disabled=true;
      if(step>0&&total>=9)b.disabled=true;
    }});
  }}
  function openPax(){{renderPax();paxPop.hidden=false;paxTrigger.setAttribute('aria-expanded','true');}}
  function closePax(){{paxPop.hidden=true;paxTrigger.setAttribute('aria-expanded','false');}}
  paxTrigger.addEventListener('click',()=>paxPop.hidden?openPax():closePax());
  paxPop.addEventListener('click',e=>{{
    e.stopPropagation();
    if(e.target.closest('[data-add-child]')){{children=1;renderPax();updatePaxValue();return;}}
    const step=e.target.closest('[data-step]');
    if(step){{
      const d=Number(step.dataset.step);
      if(step.dataset.pax==='adult') adults=Math.max(1,Math.min(9-children,adults+d));
      else children=Math.max(0,Math.min(9-adults,children+d));
      renderPax();updatePaxValue();return;
    }}
    const c=e.target.closest('[data-cabin]');
    if(c){{cabin=c.dataset.cabin;renderPax();updatePaxValue();}}
  }});

  function closeSuggestions(){{document.querySelectorAll('.search-suggest').forEach(x=>x.hidden=true);}}
  function renderSuggestions(input){{
    if(mode==='hotel')return;
    const box=input.closest('.field').querySelector('.search-suggest');
    const q=input.value.trim().toLocaleLowerCase();
    const items=(places[mode]||[]).filter(x=>(x[0]+' '+x[1]).toLocaleLowerCase().includes(q)).slice(0,6);
    box.innerHTML=items.map(x=>`<button type="button" class="suggest-item" data-value="${{x[0].replace(/"/g,'&quot;')}}"><span class="suggest-main">${{x[0]}}</span><span class="suggest-meta">${{x[1]}}</span></button>`).join('');
    box.hidden=!items.length;
  }}
  [from,to].forEach(input=>{{
    input.addEventListener('focus',()=>{{closeSuggestions();renderSuggestions(input);}});
    input.addEventListener('input',()=>renderSuggestions(input));
    input.closest('.field').querySelector('.search-suggest').addEventListener('click',e=>{{
      const item=e.target.closest('.suggest-item'); if(!item)return;
      input.value=item.dataset.value; item.closest('.search-suggest').hidden=true;
    }});
  }});
  swap.addEventListener('click',()=>{{const a=from.value;from.value=to.value;to.value=a;}});

  function setMode(next,index){{
    if(next==='hotel') return;
    mode=next;
    transportButtons.forEach((b,i)=>{{const active=i===index;b.classList.toggle('is-active',active);b.setAttribute('aria-selected',String(active));}});
    const prefix=mode==='flight'?'flight':mode==='train'?'train':'bus';
    from.placeholder=L[prefix+'_from'];to.placeholder=L[prefix+'_to'];
    searchBtn.textContent=L[prefix+'_search'];
    closeSuggestions();closePax();updatePaxValue();
  }}
  transportButtons.forEach((btn,index)=>btn.addEventListener('click',()=>setMode(modeByIndex[index],index)));
  document.addEventListener('click',e=>{{
    if(!e.target.closest('.field--place'))closeSuggestions();
    if(!e.target.closest('.field--pax'))closePax();
  }});
  document.addEventListener('keydown',e=>{{if(e.key==='Escape'){{closeSuggestions();closePax();}}}});
  updatePaxValue();
}})();'''
            old_switch=r'\(function\(\)\{\s*const buttons = document\.querySelectorAll\(\'\.transport button\'\);.*?\}\)\(\);'
            text,n=re.subn(old_switch, lambda m:new_js, text, count=1, flags=re.S)
            if n!=1: raise RuntimeError(f'transport JS not replaced in {filename}')
            path.write_text(text,encoding='utf-8')
          PY
      - name: Commit search UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: rebuild transport search controls"
            git push
          fi
