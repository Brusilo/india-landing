name: Simplify transport search labels

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify search placeholders and button copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          locales = {
              'index.html': {'from':'Откуда','to':'Куда','find':'Найти'},
              'index-en.html': {'from':'From','to':'To','find':'Find'},
              'index-hi.html': {'from':'कहाँ से','to':'कहाँ तक','find':'खोजें'},
          }

          for filename, t in locales.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              text, n1 = re.subn(r'(<input id="f-from"[^>]*placeholder=")[^"]*(")', lambda m: m.group(1)+t['from']+m.group(2), text, count=1)
              text, n2 = re.subn(r'(<input id="f-to"[^>]*placeholder=")[^"]*(")', lambda m: m.group(1)+t['to']+m.group(2), text, count=1)
              text, n3 = re.subn(r'(<button type="button" class="btn-search">)[^<]*(</button>)', lambda m: m.group(1)+t['find']+m.group(2), text, count=1)
              if (n1,n2,n3) != (1,1,1):
                  raise RuntimeError(f'Could not update initial search copy in {filename}: {(n1,n2,n3)}')

              text = re.sub(r'(\.pax-caption\{[^}]*font-weight:)500', r'\g<1>400', text, count=1)

              for key, value in [
                  ('flight_from', t['from']), ('train_from', t['from']), ('bus_from', t['from']),
                  ('flight_to', t['to']), ('train_to', t['to']), ('bus_to', t['to']),
                  ('flight_search', t['find']), ('train_search', t['find']), ('bus_search', t['find']),
              ]:
                  pattern = r'("' + re.escape(key) + r'"\s*:\s*")[^"]*(")'
                  text, count = re.subn(pattern, lambda m, v=value: m.group(1)+v+m.group(2), text, count=1)
                  if count != 1:
                      raise RuntimeError(f'{key} not updated in {filename}')

              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit simplified search copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: simplify search field labels"
            git push
          fi
