name: Fix decorative artwork layering

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix decorative artwork layering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
          /* decor-placement-fix */
          .hero{isolation:isolate}
          .hero>.hero-decor{z-index:0!important;pointer-events:none!important}
          .hero>.container{position:relative!important;z-index:2!important}
          .hero>.hero-decor--suitcase{
            width:330px!important;
            right:34px!important;
            top:105px!important;
            opacity:.88!important;
            filter:saturate(1.22) brightness(1.18)!important;
            transform:rotate(-4deg)!important;
          }
          #routes,#hotels{position:relative!important;overflow:hidden!important;isolation:isolate}
          #routes>.container,#hotels>.container{position:relative!important;z-index:2!important}
          #routes>.section-decor,#hotels>.section-decor{z-index:0!important;pointer-events:none!important}
          #routes>.section-decor--ticket{
            width:230px!important;
            right:10px!important;
            top:145px!important;
            opacity:.72!important;
            filter:saturate(1.28) brightness(1.08)!important;
            mix-blend-mode:multiply!important;
            transform:rotate(7deg)!important;
          }
          #hotels>.section-decor--keys{
            width:205px!important;
            left:14px!important;
            top:118px!important;
            opacity:.72!important;
            filter:saturate(1.28) brightness(1.08)!important;
            mix-blend-mode:multiply!important;
            transform:rotate(-7deg)!important;
          }
          @media(max-width:899px){
            .hero>.hero-decor--suitcase{width:210px!important;right:-38px!important;top:155px!important;opacity:.46!important}
            #routes>.section-decor--ticket,#hotels>.section-decor--keys{display:none!important}
          }
          '''

          for filename in ('index.html','index-en.html','index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '/* decor-placement-fix */' in text:
                  start = text.index('/* decor-placement-fix */')
                  end = text.index('</style>', start)
                  text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit layering fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: keep decorative artwork behind content"
            git push
          fi
