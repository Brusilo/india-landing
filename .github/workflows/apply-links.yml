name: Fix decorative artwork placement

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reposition decorative artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
          /* decor-placement-fix */
          .hero>.hero-decor--suitcase{
            width:360px!important;
            right:42px!important;
            top:92px!important;
            opacity:.62!important;
            transform:rotate(-5deg)!important;
          }
          #routes>.section-decor--ticket{
            width:290px!important;
            right:-34px!important;
            top:72px!important;
            opacity:.34!important;
            transform:rotate(8deg)!important;
          }
          #hotels>.section-decor--keys{
            width:215px!important;
            left:18px!important;
            top:72px!important;
            opacity:.34!important;
            transform:rotate(-8deg)!important;
          }
          @media(max-width:899px){
            .hero>.hero-decor--suitcase{width:220px!important;right:-45px!important;top:150px!important;opacity:.28!important}
            #routes>.section-decor--ticket,#hotels>.section-decor--keys{display:none!important}
          }
          '''

          for filename in ('index.html','index-en.html','index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '/* decor-placement-fix */' in text:
                  start = text.index('/* decor-placement-fix */')
                  end = text.index('</style>', start)
                  text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit placement fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: position decorative artwork"
            git push
          fi
