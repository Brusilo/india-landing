name: Refine transport search labels

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine search button and passenger label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          locales = {
              'index.html': {'flight':'Кто летит','travel':'Кто едет'},
              'index-en.html': {'flight':'Who is flying','travel':'Who is travelling'},
              'index-hi.html': {'flight':'कौन उड़ रहा है','travel':'कौन यात्रा कर रहा है'},
          }

          for filename, t in locales.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              text, n1 = re.subn(r'(\.btn-search\{[^}]*font-weight:)700', r'\g<1>400', text, count=1)
              text, n2 = re.subn(r'(<span class="pax-caption">)[^<]*(</span>)', lambda m: m.group(1)+t['flight']+m.group(2), text, count=1)
              if n1 != 1 or n2 != 1:
                  raise RuntimeError(f'Initial search UI update failed in {filename}: {(n1,n2)}')

              marker = "const from=document.getElementById('f-from'),to=document.getElementById('f-to'),searchBtn=document.querySelector('.btn-search'),swap=document.querySelector('.search .swap'),paxTrigger=document.querySelector('.pax-trigger'),paxValue=document.querySelector('.pax-value'),paxPop=document.querySelector('.pax-pop');"
              replacement = "const from=document.getElementById('f-from'),to=document.getElementById('f-to'),searchBtn=document.querySelector('.btn-search'),swap=document.querySelector('.search .swap'),paxTrigger=document.querySelector('.pax-trigger'),paxCaption=document.querySelector('.pax-caption'),paxValue=document.querySelector('.pax-value'),paxPop=document.querySelector('.pax-pop');"
              if marker not in text:
                  raise RuntimeError(f'Passenger JS marker missing in {filename}')
              text = text.replace(marker, replacement, 1)

              old = "function setMode(next,index){if(next==='hotel')return;mode=next;buttons.forEach((b,i)=>{const active=i===index;b.classList.toggle('is-active',active);b.setAttribute('aria-selected',String(active))});const p=mode==='flight'?'flight':mode==='train'?'train':'bus';from.placeholder=L[p+'_from'];to.placeholder=L[p+'_to'];searchBtn.textContent=L[p+'_search'];closeSuggest();closePax();updatePax()}"
              new = "function setMode(next,index){if(next==='hotel')return;mode=next;buttons.forEach((b,i)=>{const active=i===index;b.classList.toggle('is-active',active);b.setAttribute('aria-selected',String(active))});const p=mode==='flight'?'flight':mode==='train'?'train':'bus';from.placeholder=L[p+'_from'];to.placeholder=L[p+'_to'];searchBtn.textContent=L[p+'_search'];paxCaption.textContent=mode==='flight'?" + repr(t['flight']) + ":" + repr(t['travel']) + ";closeSuggest();closePax();updatePax()}"
              if old not in text:
                  raise RuntimeError(f'setMode marker missing in {filename}')
              text = text.replace(old, new, 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit refined search UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: refine search button and passenger label"
            git push
          fi
