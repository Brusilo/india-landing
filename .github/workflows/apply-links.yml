name: Apply localized copy updates

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update localized copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': {
                  'Автобусы, поезда и самолёты по всей России. И обратный билет домой в Индию.': 'Автобусы, поезда и самолёты по всей стране. И международные рейсы обратно домой.',
                  'Отели, хостелы и апартаменты в России и Индии': 'Отели, хостелы и апартаменты для всей поездки.',
              },
              'index-en.html': {
                  'Buses, trains and flights across Russia, plus your ticket back home to India.': 'Buses, trains and flights across the country, plus international flights back home.',
                  'Hotels, hostels and apartments in Russia and India': 'Hotels, hostels and apartments for your whole trip.',
              },
              'index-hi.html': {
                  'पूरे रूस में बस, ट्रेन और फ़्लाइट के टिकट। साथ ही भारत लौटने का टिकट भी।': 'पूरे देश में बस, ट्रेन और फ़्लाइट — और घर वापसी के लिए अंतरराष्ट्रीय उड़ानें।',
                  'रूस और भारत में होटल, हॉस्टल और अपार्टमेंट': 'पूरी यात्रा के लिए होटल, हॉस्टल और अपार्टमेंट।',
              },
          }

          for filename, reps in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in reps.items():
                  if old not in text:
                      raise RuntimeError(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "copy: refine hero and hotel messaging"
            git push
          fi
