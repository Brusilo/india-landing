name: Fix decorative artwork layout

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine decorative artwork layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
          /* decor-placement-fix */
          .hero{position:relative!important;overflow:hidden!important;isolation:isolate}
          .hero>.container{position:relative!important;z-index:2!important}
          .hero>.hero-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          .hero>.hero-decor--suitcase{
            width:520px!important;
            max-width:none!important;
            right:70px!important;
            top:92px!important;
            opacity:.96!important;
            transform:rotate(-6deg)!important;
          }

          #routes,#hotels{position:relative!important;overflow:hidden!important;isolation:isolate}
          #routes>.container,#hotels>.container{position:relative!important;z-index:2!important}
          #routes>.section-decor,#hotels>.section-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          #routes>.section-decor--ticket{
            width:250px!important;
            max-width:none!important;
            right:28px!important;
            top:72px!important;
            opacity:.84!important;
            transform:rotate(8deg)!important;
          }
          #hotels>.section-decor--keys{
            width:190px!important;
            max-width:none!important;
            left:18px!important;
            top:72px!important;
            opacity:.82!important;
            transform:rotate(-8deg)!important;
          }

          @media(max-width:1200px){
            .hero>.hero-decor--suitcase{width:430px!important;right:18px!important;top:120px!important}
            #routes>.section-decor--ticket{width:210px!important;right:12px!important}
            #hotels>.section-decor--keys{width:170px!important;left:8px!important}
          }
          @media(max-width:899px){
            .hero>.hero-decor--suitcase{width:245px!important;right:-42px!important;top:155px!important;opacity:.58!important}
            #routes>.section-decor--ticket,#hotels>.section-decor--keys{display:none!important}
          }
          '''

          for filename in ('index.html','index-en.html','index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '/* decor-placement-fix */' in text:
                  start = text.index('/* decor-placement-fix */')
                  end = text.index('</style>', start)
                  text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit layout fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: refine decorative artwork layout"
            git push
          fi
