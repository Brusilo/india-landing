name: Fix decorative artwork layout

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use original artwork and refine layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
          /* decor-placement-fix */
          .hero{position:relative!important;overflow:hidden!important;isolation:isolate}
          .hero>.container{position:relative!important;z-index:2!important}
          .hero>.hero-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          .hero>.hero-decor--suitcase{
            width:560px!important;
            max-width:none!important;
            right:72px!important;
            top:18px!important;
            opacity:1!important;
            transform:rotate(-5deg)!important;
          }

          #routes,#hotels{position:relative!important;isolation:isolate}
          #routes{overflow:visible!important}
          #hotels{overflow:hidden!important}
          #routes>.container,#hotels>.container{position:relative!important;z-index:2!important}
          #routes>.section-decor,#hotels>.section-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          #routes>.section-decor--ticket{
            width:340px!important;
            max-width:none!important;
            right:36px!important;
            top:104px!important;
            opacity:.96!important;
            transform:rotate(5deg)!important;
          }
          #hotels>.section-decor--keys{
            width:245px!important;
            max-width:none!important;
            left:16px!important;
            top:62px!important;
            opacity:.94!important;
            transform:rotate(-7deg)!important;
          }

          @media(max-width:1200px){
            .hero>.hero-decor--suitcase{width:470px!important;right:8px!important;top:40px!important}
            #routes>.section-decor--ticket{width:285px!important;right:18px!important;top:112px!important}
            #hotels>.section-decor--keys{width:210px!important;left:6px!important}
          }
          @media(max-width:899px){
            .hero>.hero-decor--suitcase{width:245px!important;right:-35px!important;top:92px!important;opacity:.72!important}
            #routes>.section-decor--ticket,#hotels>.section-decor--keys{display:none!important}
          }
          '''

          replacements = {
              'assets/decor-suitcase.png': 'assets/чемодан.png',
              'assets/decor-ticket.png': 'assets/билет.png',
              'assets/decor-keys.png': 'assets/ключи.png',
          }

          for filename in ('index.html','index-en.html','index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if '/* decor-placement-fix */' in text:
                  start = text.index('/* decor-placement-fix */')
                  end = text.index('</style>', start)
                  text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit layout fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: use original decorative artwork and refine layout"
            git push
          fi
