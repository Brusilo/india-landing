name: Refine landing layout

on:
  push:
    paths:
      - '.github/workflows/apply-links.yml'

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine artwork and footer layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = '''
          /* decor-placement-fix */
          .hero{position:relative!important;overflow:hidden!important;isolation:isolate}
          .hero>.container{position:relative!important;z-index:2!important}
          .hero>.hero-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          .hero>.hero-decor--suitcase{
            width:680px!important;
            max-width:none!important;
            right:-20px!important;
            top:-55px!important;
            opacity:1!important;
            transform:rotate(-5deg)!important;
          }

          #routes,#hotels{position:relative!important;overflow:visible!important;isolation:isolate}
          #routes>.container,#hotels>.container{position:relative!important;z-index:2!important}
          #routes>.section-decor,#hotels>.section-decor{position:absolute!important;z-index:1!important;pointer-events:none!important;user-select:none!important;image-rendering:auto!important;filter:none!important;mix-blend-mode:normal!important}
          #routes>.section-decor--ticket{
            width:420px!important;
            max-width:none!important;
            right:-54px!important;
            top:28px!important;
            opacity:1!important;
            transform:rotate(5deg)!important;
          }
          #hotels>.section-decor--keys{
            width:300px!important;
            max-width:none!important;
            left:-35px!important;
            top:40px!important;
            opacity:1!important;
            transform:rotate(-7deg)!important;
          }

          .footer{padding-top:30px!important;padding-bottom:30px!important}
          .footer-logo{margin-bottom:22px!important}
          .footer-grid{gap:28px 32px!important;padding-bottom:30px!important;margin-bottom:20px!important}
          @media(min-width:1024px){
            .footer{padding-top:30px!important;padding-bottom:32px!important}
            .footer-logo{margin-bottom:24px!important}
            .footer-grid{gap:30px 36px!important;padding-bottom:32px!important;margin-bottom:20px!important}
          }

          @media(max-width:1200px){
            .hero>.hero-decor--suitcase{width:560px!important;right:-28px!important;top:-30px!important}
            #routes>.section-decor--ticket{width:340px!important;right:-45px!important;top:30px!important}
            #hotels>.section-decor--keys{width:250px!important;left:-28px!important;top:46px!important}
          }
          @media(max-width:899px){
            .hero>.hero-decor--suitcase{width:270px!important;right:-42px!important;top:30px!important;opacity:.82!important}
            #routes>.section-decor--ticket,#hotels>.section-decor--keys{display:none!important}
            .footer{padding-top:24px!important}
            .footer-logo{margin-bottom:20px!important}
          }
          '''

          replacements = {
              'assets/decor-suitcase.png': 'assets/чемодан.png',
              'assets/decor-ticket.png': 'assets/билет.png',
              'assets/decor-keys.png': 'assets/ключи.png',
          }

          for filename in ('index.html','index-en.html','index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if '/* decor-placement-fix */' in text:
                  start = text.index('/* decor-placement-fix */')
                  end = text.index('</style>', start)
                  text = text[:start] + css + text[end:]
              else:
                  text = text.replace('</style>', css + '</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit layout changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: fine tune decorative artwork positions"
            git push
          fi
