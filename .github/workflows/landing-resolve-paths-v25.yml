name: Inspect official destination directories
on:
  push:
    paths:
      - '.github/workflows/landing-resolve-paths-v25.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read official directories and extract links
        run: |
          mkdir -p resolved-paths
          python3 - <<'PY'
          import urllib.request,json,re,time,concurrent.futures,http.client
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.items=[];self.link=None
            def handle_starttag(self,tag,attrs):
              if tag=='a':self.link={'href':dict(attrs).get('href',''),'text':''}
            def handle_data(self,data):
              if self.link:self.link['text']+=data
            def handle_endtag(self,tag):
              if tag=='a' and self.link:self.items.append(self.link);self.link=None
          urls=[
            'https://avia.tutu.ru/f/Moskva/',
            'https://www.tutu.ru/poezda/Moskva/',
            'https://bus.tutu.ru/raspisanie/gorod_Moskva/',
            'https://bus.tutu.ru/raspisanie/gorod_Moskva/gorod_Kazan/',
            'https://bus.tutu.ru/raspisanie/gorod_Moskva/gorod_Ufa/',
            'https://bus.tutu.ru/raspisanie/gorod_Moskva/gorod_Gelendzhik/',
            'https://bus.tutu.ru/raspisanie/gorod_Ufa/gorod_Kazan/?from=1324779&to=1330021&date=20.09.2026&travelers=2.6&amount=3'
          ]+[f'https://hotel.tutu.ru/c_{c}/' for c in ['russia','india','kazakhstan','belarus','uzbekistan','kirgizstan','tadjikistan','turkmenistan','moldova','azerbaijan','armenia','georgia','china','united_arab_emirates']]
          def read(pair):
            i,url=pair;row={'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LandingLinkSmokeTest/1.0)'})
              with urllib.request.urlopen(req,timeout=8) as r:
                try:data=r.read(4500000)
                except http.client.IncompleteRead as e:data=e.partial;row['incomplete']=True
                text=data.decode('utf-8','replace');row.update(status=r.status,final_url=r.url)
                parser=Links();parser.feed(text);row['links']=parser.items
                Path(f'resolved-paths/page-{i:02d}.html').write_text(text,encoding='utf-8')
            except Exception as e:row['error']=str(e)
            time.sleep(.4);return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(read,enumerate(urls)))
          Path('resolved-paths/results.json').write_text(json.dumps(results,ensure_ascii=False),encoding='utf-8')
          print([(r['url'],r.get('status'),len(r.get('links',[]))) for r in results])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: landing-resolved-paths-v25
          path: resolved-paths/
          retention-days: 1
