name: Read-only public destination audit
on:
  push:
    paths:
      - '.github/workflows/landing-public-audit-v25.yml'
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public pages without booking or submitting user data
        run: |
          mkdir -p public-audit
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, time
          from pathlib import Path
          urls = [
            'https://brusilo.github.io/india-landing/index.html',
            'https://brusilo.github.io/india-landing/index-en.html',
            'https://brusilo.github.io/india-landing/index-hi.html',
            'https://www.tutu.ru/poezda/Kazan/Moskva/?date=20.09.2026&travelers=3.6',
            'https://www.tutu.ru/poezda/Moskva/Ioshkar-Ola/',
            'https://www.tutu.ru/poezda/Moskva/Nizhnij-Novgorod/',
            'https://www.tutu.ru/poezda/Moskva/Adler/',
            'https://www.tutu.ru/poezda/Moskva/Khabarovsk/',
            'https://avia.tutu.ru/f/Deli/Moskva/?class=Y&travelers=1&route%5B0%5D=216-20092026-491&search_extension=avia',
            'https://avia.tutu.ru/f/Moskva/Bangalor/',
            'https://avia.tutu.ru/f/Sochi/Moskva/?class=C&travelers=3.4&route%5B0%5D=78-27092026-491&search_extension=avia',
            'https://hotel.tutu.ru/c_russia/moscow/?check_in=2026-09-20&check_out=2026-09-22&geo_id=2657260&geo_type=locality&room%5B0%5D=2.5',
            'https://hotel.tutu.ru/c_india/delhi/',
            'https://hotel.tutu.ru/c_russia/adler/',
            'https://hotel.tutu.ru/c_russia/loo/',
            'https://hotel.tutu.ru/c_russia/nizhny_novgorod/',
            'https://hotel.tutu.ru/h_gostevye_komnaty_i_apartamenty_grifon/',
            'https://bus.tutu.ru/raspisanie/gorod_Moskva/gorod_Loo/?from=1447874&to=2082727&date=18.09.2026&travelers=1.5&amount=2',
            'https://bus.tutu.ru/raspisanie/gorod_Ufa/gorod_Kazan/?date=18.09.2026&travelers=1.5&amount=2',
            'https://www.tutu.ru/juicy-offers/'
          ]
          results=[]
          for i,url in enumerate(urls):
            row={'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LandingLinkSmokeTest/1.0)'})
              with urllib.request.urlopen(req,timeout=7) as r:
                text=r.read(4000000).decode('utf-8','replace')
                row.update(status=r.status,final_url=r.url,bytes=len(text))
                title=re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I)
                row['title']=re.sub(r'\s+',' ',title.group(1)) if title else ''
                row['challenge']=bool(re.search(r'captcha|access denied|robot check|just a moment',row['title'],re.I))
                Path('public-audit/page-%02d.html'%i).write_text(text,encoding='utf-8')
            except Exception as e:
              row['error']=str(e)
            results.append(row)
            print(json.dumps(row,ensure_ascii=False))
            time.sleep(.3)
          Path('public-audit/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: landing-public-audit-v25
          path: public-audit/
          retention-days: 1
