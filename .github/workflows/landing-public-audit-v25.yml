name: Read-only public destination audit
on:
  push:
    paths:
      - '.github/workflows/landing-public-audit-v25.yml'
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare canonical city path checks
        run: |
          mkdir -p public-audit
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const c={window:{},document:{documentElement:{lang:'ru'}},URLSearchParams};vm.createContext(c);
          for(const f of ['search-places.js','tutu-link-builder.js'])vm.runInContext(fs.readFileSync('assets/'+f,'utf8'),c);
          const {TUTU_PLACES:P,TUTU_LINKS:L}=c.window;
          const cases=[];
          for(const p of P.places){
            const peer=p.id==='ru-moscow'?'Sochi':'Moskva';
            for(const mode of ['flight','train','bus','hotel']){
              if(!L.supports(mode,p))continue;
              let slug,url;
              if(mode==='flight'){slug=L.aviaSlug(p);url='https://avia.tutu.ru/f/'+peer+'/'+slug+'/';}
              if(mode==='train'){slug=L.railSlug(p);url='https://www.tutu.ru/poezda/'+peer+'/'+slug+'/';}
              if(mode==='bus'){slug=L.railSlug(p);url='https://bus.tutu.ru/raspisanie/gorod_'+peer+'/gorod_'+slug+'/';}
              if(mode==='hotel'){slug=L.hotelSlug(p);url='https://hotel.tutu.ru/c_'+L.countrySlug[p.country]+'/'+slug+'/';}
              cases.push({id:p.id,name:p.name.ru,mode,slug,url});
            }
          }
          fs.writeFileSync('public-audit/cases.json',JSON.stringify(cases));
          JS
      - name: Read public pages with bounded concurrency and timeouts
        run: |
          python3 - <<'PY'
          import urllib.request, re, json, time, concurrent.futures
          from pathlib import Path
          cases=json.loads(Path('public-audit/cases.json').read_text())
          def read(case):
            row=dict(case)
            try:
              req=urllib.request.Request(case['url'],headers={'User-Agent':'Mozilla/5.0 (compatible; LandingLinkSmokeTest/1.0)'})
              with urllib.request.urlopen(req,timeout=6) as r:
                text=r.read(2500000).decode('utf-8','replace')
                row.update(status=r.status,final_url=r.url)
                t=re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I)
                row['title']=re.sub(r'\s+',' ',t.group(1)) if t else ''
                row['challenge']=bool(re.search(r'captcha|access denied|robot check|just a moment',row['title'],re.I))
                if case['mode']=='flight':
                  for key in ['departureCityId','arrivalCityId','arrivalCity','arrivalCityTranslit']:
                    m=re.search(r'"'+key+r'"\s*:\s*"([^"]+)"',text)
                    if m:row[key]=m.group(1)
                if case['mode']=='hotel':
                  plain=text.replace('\\"','"')
                  m=re.search(r'"initSearchParams":\{.{0,700}?"geoId":(\d+).*?"geoName":"([^"]+)"',plain)
                  if m:row.update(geoId=int(m.group(1)),geoName=m.group(2))
                if case['mode']=='bus':
                  snippets=[]
                  for pattern in ['"from"','"to"','"departureCityId"','"arrivalCityId"','"searchParams"','"cityFrom"','"cityTo"']:
                    for m in list(re.finditer(re.escape(pattern),text))[:2]:snippets.append(text[max(0,m.start()-30):m.end()+220])
                  row['snippets']=snippets
                  if case['id'] in ['ru-kazan','ru-ufa','ru-gelendzhik']:Path('public-audit/bus-'+case['id']+'.html').write_text(text,encoding='utf-8')
            except Exception as e:
              row['error']=str(e)
              if hasattr(e,'code'):row['status']=e.code
            time.sleep(.35)
            return row
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            for row in pool.map(read,cases):results.append(row)
          Path('public-audit/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={}
          for r in results:
            key=r['mode']+':'+str(r.get('status','timeout'))
            summary[key]=summary.get(key,0)+1
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-city-path-audit-v25
          path: public-audit/
          retention-days: 1
