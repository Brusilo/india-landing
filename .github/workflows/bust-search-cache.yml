name: Bust search asset cache

on:
  push:
    paths:
      - '.github/workflows/bust-search-cache.yml'

permissions:
  contents: write

jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Version search assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = '20260917-1534'
          for name in ['index.html','index-en.html','index-hi.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="assets/search-v2.css"', f'href="assets/search-v2.css?v={version}"')
              s = s.replace('src="assets/search-v2.js"', f'src="assets/search-v2.js?v={version}"')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          for f in index.html index-en.html index-hi.html; do
            grep -q 'search-v2.css?v=20260917-1534' "$f"
            grep -q 'search-v2.js?v=20260917-1534' "$f"
          done
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          git commit -m "Bust search asset cache"
          git push origin HEAD:main
