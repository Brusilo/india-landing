name: Research composite Tutu routes

on:
  push:
    paths:
      - '.github/workflows/research-composite-routes.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Indian city geo aliases
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          qs=['Мумбаи','Mumbai','Bombay','Бомбей','मुंबई','Delhi','New Delhi','Нью-Дели','Bengaluru','Bangalore','Бангалор','Goa','Гоа']
          out={}
          for q in qs:
            url='https://bus.tutu.ru/api/v1/geo/suggest?name='+urllib.parse.quote(q)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read().decode('utf-8','replace')
              data=json.loads(body)
              out[q]=data
              gps=((data.get('data') or {}).get('geopoints') or [])
              print('QUERY',q)
              for g in gps[:10]:
                print(' GEO',json.dumps({k:g.get(k) for k in ['id','commonId','name','tutuExternalId','latitude','longitude','names']},ensure_ascii=False)[:5000])
            except Exception as e:
              out[q]={'error':repr(e)}
              print('ERR',q,repr(e))
          Path('indian-geo-aliases.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: indian-geo-aliases
          path: indian-geo-aliases.json
