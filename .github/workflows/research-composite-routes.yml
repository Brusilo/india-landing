name: Research composite Tutu routes

on:
  push:
    paths:
      - '.github/workflows/research-composite-routes.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Tutu geo API and route pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request, time
          from pathlib import Path

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          base='https://bus.tutu.ru/api/v1/geo/suggest?name='
          names=[
            'Дели','Мумбаи',
            'Тверь','Рязань','Смоленск','Тула','Орёл','Белгород','Курск','Воронеж',
            'Ростов-на-Дону','Йошкар-Ола','Чебоксары','Саранск','Пенза','Псков',
            'Ярославль','Иваново','Тамбов','Ульяновск','Архангельск','Саратов'
          ]

          def get(url,timeout=30):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/html;q=0.9,*/*;q=0.8'})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.status,r.geturl(),r.read().decode('utf-8','replace'),dict(r.headers)

          all_suggest={}
          for name in names:
            url=base+urllib.parse.quote(name)
            try:
              status,final,body,headers=get(url)
              try:data=json.loads(body)
              except Exception:data={'_raw':body[:2000]}
              all_suggest[name]={'status':status,'url':final,'data':data}
              print('SUGGEST',name,status,json.dumps(data,ensure_ascii=False)[:6000])
            except Exception as e:
              all_suggest[name]={'error':repr(e)}
              print('SUGGEST_ERR',name,repr(e))

          Path('suggestions.json').write_text(json.dumps(all_suggest,ensure_ascii=False,indent=2),encoding='utf-8')

          # Also validate the user's known working deep link and a few pattern variants.
          known=[
            ('tver_to_delhi','https://bus.tutu.ru/raspisanie/gorod_Tver/gorod_Deli_2098491/?from=1369087&to=2098491&date=26.09.2026&travelers=1&amount=1'),
            ('delhi_to_tver','https://bus.tutu.ru/raspisanie/gorod_Deli_2098491/gorod_Tver/?from=2098491&to=1369087&date=26.09.2026&travelers=1&amount=1'),
          ]
          report=[]
          for label,url in known:
            try:
              status,final,body,headers=get(url,45)
              title=''
              m=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
              if m:title=re.sub(r'\s+',' ',m.group(1)).strip()
              text=re.sub(r'<[^>]+>',' ',body)
              text=re.sub(r'\s+',' ',text)
              markers={k:text.lower().count(k) for k in ['пересад','дели','твер','мумбаи','маршрут']}
              item={'label':label,'status':status,'final':final,'title':title,'size':len(body),'markers':markers}
              report.append(item)
              print('ROUTE',json.dumps(item,ensure_ascii=False))
              for needle in ['пересад','Дели','Твер']:
                p=text.lower().find(needle.lower())
                if p>=0: print('ROUTE_SNIP',label,needle,text[max(0,p-450):p+900])
            except Exception as e:
              item={'label':label,'url':url,'error':repr(e)}
              report.append(item);print('ROUTE_ERR',json.dumps(item,ensure_ascii=False))
          Path('known-routes.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: composite-route-probe
          path: |
            suggestions.json
            known-routes.json
