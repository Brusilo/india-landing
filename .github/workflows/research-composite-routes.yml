name: Research composite Tutu routes

on:
  push:
    branches:
      - composite-routes-20260924

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/search-places.js
          node --check assets/tutu-link-builder.js
          node --check assets/search-v2.js
      - name: Data and link regression
        run: node tests/landing-data.cjs . /tmp/landing-data.json
      - name: Composite UI smoke
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8000/index-ru.html')
            for _ in range(30):
              if d.find_elements(By.CSS_SELECTOR,'.search-v2'):break
              time.sleep(.2)
            f=d.find_element(By.CSS_SELECTOR,'[data-role="from"] input')
            f.send_keys('Дели');time.sleep(.3)
            d.find_element(By.CSS_SELECTOR,'[data-role="from"] [data-place-id="in-delhi"]').click()
            t=d.find_element(By.CSS_SELECTOR,'[data-role="to"] input')
            t.send_keys('Тверь');time.sleep(.3)
            assert d.find_elements(By.CSS_SELECTOR,'[data-role="to"] [data-place-id="ru-tver"]'), 'Tver composite suggestion missing'
            f.click();f.clear();f.send_keys('Mumbai');time.sleep(.3)
            d.find_element(By.CSS_SELECTOR,'[data-role="from"] [data-place-id="in-mumbai"]').click()
            t.click();t.clear();t.send_keys('Тверь');time.sleep(.3)
            assert not d.find_elements(By.CSS_SELECTOR,'[data-role="to"] [data-place-id="ru-tver"]'), 'unverified Mumbai-Tver pair leaked'
            print('COMPOSITE_UI_SMOKE_OK')
          finally:
            d.quit()
          PY
