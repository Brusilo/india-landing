name: Finalize resort links v11

on:
  push:
    paths:
      - '.github/workflows/finalize-resorts-v11.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final changes
        run: python3 tools/finalize_v11.py
      - name: Validate files
        run: |
          node --check assets/search-places.js
          node --check assets/card-links.js
          grep -q 'Лазаревское' assets/search-places.js
          grep -q 'Зеленоградск' assets/search-places.js
          grep -q 'combinedFallback' assets/card-links.js
          grep -q '20260917-places-11' index.html
          grep -q '20260917-places-11' index-en.html
          grep -q '20260917-places-11' index-hi.html
          grep -q '20260917-links-11' index.html
          grep -q '20260917-links-11' index-en.html
          grep -q '20260917-links-11' index-hi.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize resort cities and route fallbacks v11'
          git push
