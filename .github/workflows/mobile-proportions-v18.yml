name: Refine mobile hero and carousel proportions
on:
  push:
    paths:
      - '.github/workflows/mobile-proportions-v18.yml'
permissions:
  contents: write
jobs:
  proportions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply locally verified responsive adjustments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          p = Path('assets/responsive.css')
          data = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob == 'ee37afdc0042ef8d4cf5f41de2a6d1bb4cf0ada4', 'Responsive CSS changed since the tested baseline; stop rather than overwrite'
          s = data.decode('utf-8')
          changes = [(
              '  .hero h1 {\n    max-width: calc(100% - 112px); min-height: 150px;\n    font-size: clamp(29px, 7.8vw, 36px); line-height: 1.12; letter-spacing: -.025em;\n  }',
              '  /* Let the headline lead; the suitcase is decoration, not a separate column. */\n  .hero h1 {\n    max-width: 100%; min-height: 0;\n    font-size: clamp(36px, 10.7vw, 48px); line-height: 1.08; letter-spacing: -.025em;\n  }'
          ), (
              '  .hero > .hero-decor--suitcase {\n    width: 232px !important; height: auto !important; right: -48px !important;\n    top: -28px !important; bottom: auto !important; opacity: 1 !important; transform: none !important;\n  }',
              '  .hero > .hero-decor--suitcase {\n    width: clamp(300px, 92vw, 400px) !important; height: auto !important; right: -88px !important;\n    top: -36px !important; bottom: auto !important; opacity: .48 !important; transform: none !important;\n    /* Fade the artwork before it reaches the transport controls. */\n    -webkit-mask-image: linear-gradient(to bottom, #000 25%, transparent 94%);\n    mask-image: linear-gradient(to bottom, #000 25%, transparent 94%);\n  }'
          ), (
              '    padding: 12px 0 44px !important;',
              '    padding: 24px 0 44px !important;'
          ), (
              '  .row > * { flex: 0 0 clamp(220px, 74vw, 300px); scroll-snap-align: start; min-width: 0; }',
              '  /* One complete card plus half of the next one on phones. */\n  .row > * { flex: 0 0 calc((100% + 4px) / 1.5); scroll-snap-align: start; min-width: 0; }\n  .row .card-media { aspect-ratio: 1.8; }'
          ), (
              '  .card-body { padding: 16px; gap: 7px; }',
              '  .card-body { padding: 14px; gap: 7px; }'
          ), (
              '  .hero h1 { max-width: calc(100% - 160px); min-height: 156px; font-size: 42px; }\n  .hero > .hero-decor--suitcase { width: 260px !important; top: -30px !important; right: max(0px, calc((100vw - 768px)/2)) !important; }',
              '  .hero h1 { max-width: 560px; min-height: 0; font-size: 48px; }\n  .hero > .hero-decor--suitcase { width: 400px !important; top: -42px !important; right: max(-40px, calc((100vw - 848px)/2)) !important; }'
          ), (
              '  .stage { margin-inline: 0; padding: 28px 24px; }',
              '  .row > * { flex-basis: 300px; }\n  .stage { margin-inline: 0; padding: 28px 24px; }'
          )]
          for old, new in changes:
              assert s.count(old) == 1, 'Expected exactly one matching CSS block: ' + old
              s = s.replace(old, new, 1)
          assert hashlib.sha256(s.encode()).hexdigest() == '8cd70734e3a74c7bacbd7d924591e8e44eb003b2be32d3e33f9e2bdb8ac071e5', 'Must match the browser-tested CSS exactly'
          assert s.count('{') == s.count('}')
          assert 'overflow-x: clip !important; overflow-y: visible !important;' in s
          p.write_text(s, encoding='utf-8')

          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'assets/responsive\.css\?v=[^"\s]+', 'assets/responsive.css?v=20260917-mobile-18', text)
              assert count == 1, filename
              p.write_text(text, encoding='utf-8')

          Path('docs/mobile-proportions-checks.md').write_text('''# Mobile hero and carousel proportions

          Baseline: 843fb4be312b898fa6c6d9a83798e35e821e1506.
          Scope: responsive CSS and its cache version in RU / EN / HI only.
          No changes to page copy, section order, images, prices, JavaScript,
          city data, search logic or destination URLs.

          ## Visual change
          The headline uses the full available width and a 36-48px fluid size.
          The larger suitcase is a translucent background accent on the right,
          with a vertical fade and the existing horizontal containment retained.
          Phone carousels show one card and half of the next. On tablets cards
          remain 300px wide. Media panels and internal padding are more compact.
          At a 390px viewport the first RU route card changed from approximately
          289x351px to 241x300px. Title and price font sizes remain unchanged.

          ## Checks completed before publishing
          Chromium/Playwright, local build assets rendered offline.
          30 layout cases: three locales at 320, 360, 390, 414, 480, 599,
          600, 768, 1024 and 1100 CSS px. No document horizontal overflow or
          clipped card titles/prices; quick city/date chips remain hidden.
          On phone widths the visible fraction of the second card is 0.5.
          24 form cases: all four modes, all locales, at 390 and 768px.
          Checked persistent autocomplete, mixed-script city entry, selection,
          swapping cities, single and hotel-range calendars and passenger panels.
          Six emulated touch swipes moved both carousels in all locales.
          Six full-page desktop comparisons at 1101 and 1440px were pixel-identical
          to baseline. Page HTML differs only in the responsive stylesheet version.
          All existing JavaScript files are byte-identical to baseline.

          These checks are browser emulation, not physical-device or Safari tests.
          External Google Fonts were blocked for offline comparison; bundled
          Tutu fonts and local system script fallbacks were used in both versions.
          ''', encoding='utf-8')
          Path('.github/workflows/mobile-proportions-v18.yml').unlink()
          print('Applied the exact locally tested CSS and refreshed all locale stylesheet versions.')
          PY
      - name: Commit responsive presentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html docs/mobile-proportions-checks.md .github/workflows/mobile-proportions-v18.yml
          git diff --cached --check
          git commit -m 'style: larger mobile headline, background suitcase and 1.5-card carousels'
          git push
