name: Verify Tutu link builder v3

on:
  push:
    paths:
      - '.github/workflows/verify-link-builder-v3.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump cache version
        run: |
          sed -i 's/tutu-links-2/tutu-links-3/g' index.html index-en.html index-hi.html
      - name: Validate builder
        run: |
          node --check assets/tutu-link-builder.js
          node -e "global.window={};require('./assets/tutu-link-builder.js');const L=window.TUTU_LINKS,p=(id,country,canonical,ru)=>({id,country,canonical,name:{ru}}),d=(y,m,day)=>new Date(y,m-1,day);let u=L.build('flight',{from:p('ru-sochi','RU','Sochi','Сочи'),to:p('ru-moscow','RU','Moscow','Москва'),date:d(2026,9,18),adults:3,children:0,childAges:[],cabin:'economy'});if(!u.includes('route%5B0%5D=78-18092026-491'))throw Error(u);u=L.build('flight',{from:p('in-bengaluru','IN','Bengaluru','Бангалор'),to:p('ru-moscow','RU','Moscow','Москва'),date:d(2026,9,20),adults:1,children:0,childAges:[],cabin:'economy'});if(!u.includes('/f/Bangalor/Moskva/'))throw Error(u);u=L.build('train',{from:p('ru-moscow','RU','Moscow','Москва'),to:p('ru-nizhny-novgorod','RU','Nizhny Novgorod','Нижний Новгород'),date:d(2026,9,20),adults:2,children:0,childAges:[]});if(!u.includes('/poezda/Moskva/Nizhnij-Novgorod/'))throw Error(u);u=L.build('bus',{from:p('ru-kazan','RU','Kazan','Казань'),to:p('ru-moscow','RU','Moscow','Москва'),date:d(2026,9,20),adults:3,children:1,childAges:[6]});if(!u.includes('/poezda/Kazan/Moskva/')||!u.includes('travelers=3.6'))throw Error(u);console.log('builder v3 OK')"
          git diff --check
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-link-builder-v3.yml
          git add index.html index-en.html index-hi.html
          git commit -m "Refresh Tutu link builder cache v3"
          git push origin HEAD:main
