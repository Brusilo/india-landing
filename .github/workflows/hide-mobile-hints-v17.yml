name: Hide mobile quick search hints
on:
  push:
    paths:
      - '.github/workflows/hide-mobile-hints-v17.yml'
permissions:
  contents: write
jobs:
  hide-hints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested mobile-only hint visibility change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/responsive.css')
          css = p.read_text(encoding='utf-8')
          old = ('  .search-hints.search-hints-v2, .search-hints.search-hints-v2[data-mode="hotel"] {\n'
                 '    display: grid !important; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 10px;\n'
                 '    margin-top: 10px; width: 100%;\n'
                 '  }')
          new = ('  /* Hide quick city/date chips on compact screens; keep city autocomplete. */\n'
                 '  .search-hints.search-hints-v2, .search-hints.search-hints-v2[data-mode="hotel"] {\n'
                 '    display: none !important;\n'
                 '  }')
          assert css.count(old) == 1, 'Expected compact quick-hints rule exactly once'
          css = css.replace(old, new, 1)
          assert 'overflow-x: clip !important; overflow-y: visible !important;' in css
          p.write_text(css, encoding='utf-8')

          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'assets/responsive\.css\?v=[^"\s]+', 'assets/responsive.css?v=20260917-mobile-17', text)
              assert count == 1, filename + ': expected one responsive stylesheet'
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/hide-mobile-hints-v17.yml').unlink()
          print('Compact city/date chips hidden; autocomplete and desktop rules unchanged; all locale stylesheets versioned.')
          PY
      - name: Commit tested change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/hide-mobile-hints-v17.yml
          git diff --cached --check
          git commit -m 'fix: hide mobile quick city and date hints without changing autocomplete'
          git push
