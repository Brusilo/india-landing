name: Update low price copy

on:
  push:
    paths:
      - '.github/workflows/update-low-price-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'index.html': ('Цены ниже средних за последние 10 дней', 'Популярные направления по низким ценам'),
              'index-en.html': ('Prices below the 10-day average', 'Popular routes at low prices'),
              'index-hi.html': ('पिछले 10 दिनों के औसत से कम दाम', 'कम कीमतों पर लोकप्रिय रूट'),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {name}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          grep -q 'Популярные направления по низким ценам' index.html
          grep -q 'Popular routes at low prices' index-en.html
          grep -q 'कम कीमतों पर लोकप्रिय रूट' index-hi.html
          git diff --check
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-low-price-copy.yml
          git add index.html index-en.html index-hi.html
          git commit -m "Update low price destinations copy"
          git push origin HEAD:main
