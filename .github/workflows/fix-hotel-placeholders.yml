name: Fix hotel placeholders

on:
  push:
    paths:
      - '.github/workflows/fix-hotel-placeholders.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply hotel placeholder fix
        run: python3 .github/scripts/fix_hotel_placeholders.py

      - name: Validate
        shell: bash
        run: |
          node --check assets/search-v2.js
          grep -q "hotelWhere:'Город'" assets/search-v2.js
          grep -q "hotelWhere:'City'" assets/search-v2.js
          grep -q "hotelWhere:'शहर'" assets/search-v2.js
          grep -q 'v2-field--date:not(.has-value)' assets/search-v2.css
          for f in index.html index-en.html index-hi.html; do
            grep -q 'search-v2.css?v=20260917-hotel-placeholder' "$f"
            grep -q 'search-v2.js?v=20260917-hotel-placeholder' "$f"
          done
          git diff --check

      - name: Commit fix and clean helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hotel-placeholders.yml .github/scripts/fix_hotel_placeholders.py
          git add assets/search-v2.js assets/search-v2.css index.html index-en.html index-hi.html
          git commit -m "Polish hotel empty field styling"
          git push origin HEAD:main
