name: Publish audited landing fixes
on:
  push:
    paths:
      - '.github/workflows/apply-audit-v25.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate payloads and source versions before applying changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          digests = {
              'runtime': '6089f1d0e40060381d4392093791cbc7e636e676ddc317fbe29f3f87497b2c42',
              'registry': '2c6dc11edd1e8e9aec8d8bf87f376cd155d48b36c563f77ac72af4160cd64d41',
              'tests': 'f62e8fb8318b5dff79e63ce979a4c9de01d47d42676a706e3f431f0ce608dbd8',
              'report': 'a940c097eed7e142f31761c0b4eda65de4f946827b3061f366ebea9451cdf5f4',
          }
          prepared = {}
          for group, digest in digests.items():
              packed = Path('.github/audit-v25/' + group + '.b64').read_text().strip()
              raw = lzma.decompress(base64.b64decode(packed, validate=True))
              assert hashlib.sha256(raw).hexdigest() == digest, group + ': payload integrity mismatch'
              for filename, change in json.loads(raw).items():
                  assert filename not in prepared, 'Duplicate file: ' + filename
                  path = Path(filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert filename.startswith(('assets/', 'docs/', 'tests/')) or filename in ('index.html', 'index-en.html', 'index-hi.html')
                  if change['before'] is None:
                      assert not path.exists(), filename + ': new file already exists'
                      original = ''
                  else:
                      original = path.read_text(encoding='utf-8')
                      assert hashlib.sha256(original.encode()).hexdigest() == change['before'], filename + ': source changed; reconcile instead of overwriting'
                  lines = original.splitlines(keepends=True)
                  for start, end, text in reversed(change['edits']):
                      assert 0 <= start <= end <= len(lines), filename + ': invalid edit range'
                      lines[start:end] = [text]
                  result = ''.join(lines)
                  assert hashlib.sha256(result.encode()).hexdigest() == change['after'], filename + ': result integrity mismatch'
                  prepared[filename] = result
          for filename, text in prepared.items():
              path = Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Installed exact browser-tested content for', len(prepared), 'files.')
          PY
      - name: Run JavaScript syntax and complete city and link regression suite
        shell: bash
        run: |
          for f in assets/*.js; do node --check "$f"; done
          node tests/landing-data.cjs . /tmp/landing-data-results.json
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              text = Path(filename).read_text()
              assert text.count('assets/tutu-destinations.js?v=20260917-audit-25') == 1, filename
              assert text.index('assets/tutu-destinations.js') < text.index('assets/tutu-link-builder.js')
              for name in ('responsive.css', 'search-v2.css', 'search-places.js', 'search-v2.js', 'tutu-link-builder.js', 'card-links.js'):
                  assert 'assets/' + name + '?v=20260917-audit-25' in text, filename + ': ' + name
              assert 'mc.yandex' not in text and 'ym(' not in text, 'Metrika is reserved for the next task'
          print('Three locale pages and script order validated; Metrika remains untouched.')
          PY
      - name: Remove temporary audit installers and commit verified production changes
        shell: bash
        run: |
          rm .github/audit-v25/runtime.b64 .github/audit-v25/registry.b64 .github/audit-v25/tests.b64 .github/audit-v25/report.b64
          rmdir .github/audit-v25
          rm .github/workflows/landing-public-audit-v25.yml .github/workflows/landing-resolve-paths-v25.yml .github/workflows/landing-verify-corrections-v25.yml .github/workflows/landing-final-links-v25.yml .github/workflows/apply-audit-v25.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add assets/tutu-destinations.js docs/landing-audit-v25.md docs/landing-audit-v25-results.json docs/destination-sources-v25.json tests/README.md tests/fixture.py tests/landing-browser.py tests/landing-calendar.py tests/landing-data.cjs tests/landing-edges.py
          git diff --cached --check
          git commit -m 'fix: audited multilingual search and canonical links; lift desktop ticket 40px'
          git push
