name: Fix mobile hero horizontal overflow
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-overflow-v16.yml'
permissions:
  contents: write
jobs:
  fix-overflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested hero containment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('assets/responsive.css')
          original = path.read_text(encoding='utf-8')
          raw = original.encode('utf-8')
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == 'a4449e3523c8608850498a0f964daaa05b3964fa', 'Responsive CSS changed: review before applying'
          old = '    padding: 12px 0 44px !important; overflow: visible !important;'
          new = '\n'.join([
              '    padding: 12px 0 44px !important;',
              '    /* Clip the decorative image horizontally without clipping form expansion. */',
              '    overflow-x: clip !important; overflow-y: visible !important;'
          ])
          assert original.count(old) == 1
          updated = original.replace(old, new, 1)
          assert updated.replace(new, old, 1) == original
          changes = {path: updated}
          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              page = Path(filename)
              text = page.read_text(encoding='utf-8')
              old_url = 'assets/responsive.css?v=20260917-mobile-1'
              new_url = 'assets/responsive.css?v=20260917-mobile-2'
              assert text.count(old_url) == 1, filename
              result = text.replace(old_url, new_url, 1)
              assert result.replace(new_url, old_url, 1) == text
              changes[page] = result
          for file, text in changes.items():
              file.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-mobile-overflow-v16.yml').unlink()
          print('Applied mobile-only horizontal containment; no copy, form logic, or desktop styles changed.')
          PY
      - name: Commit mobile overflow fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/fix-mobile-overflow-v16.yml
          git diff --cached --check
          git commit -m 'fix: contain mobile suitcase overflow and remove blank screenshot strip'
          git push
