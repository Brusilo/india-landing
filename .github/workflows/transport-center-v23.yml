name: Center desktop transport illustration
on:
  push:
    paths:
      - '.github/workflows/transport-center-v23.yml'
permissions:
  contents: write
jobs:
  center-circle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove desktop upward offset while preserving mobile layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('assets/responsive.css')
          raw = path.read_bytes()
          blob_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob_sha == '70a6a8c3c3a993c22558fc8cd78840a8ba6c9180', 'Responsive CSS changed; review before applying'
          css = raw.decode('utf-8')
          old = ('  /* Lift only this illustration; preserve text flow and the other icons. */\n'
                 '  transform: translateY(-16px);')
          new = ('  /* Center within the card rather than offsetting the illustration upward. */\n'
                 '  align-self: center;\n'
                 '  transform: none;')
          assert css.count(old) == 1, 'Expected one desktop icon offset'
          path.write_text(css.replace(old, new, 1), encoding='utf-8')

          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = 'assets/responsive.css?v=20260917-transport-22'
              new = 'assets/responsive.css?v=20260917-transport-23'
              assert text.count(old) == 1, filename + ': unexpected stylesheet version'
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/transport-center-v23.yml').unlink()
          print('Desktop circle centered by removing -16px offset. Mobile, copy, dimensions and ticket position unchanged.')
          PY
      - name: Commit scoped centering fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/transport-center-v23.yml
          git diff --cached --check
          git commit -m 'style: center desktop transport circle without changing mobile layout'
          git push
