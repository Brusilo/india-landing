name: Update India landing FX and verified prices

on:
  schedule:
    # Every 20 minutes at :07, :27 and :47, off the top of the hour. GitHub
    # silently drops most scheduled runs: with an hourly cron only 10 ran in
    # 53 hours (13-15 Oct 2026, 3-6 h apart), so more attempts are scheduled.
    # GitHub Actions uses UTC; UTC+3 remains constant year-round for Moscow.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-market-data.py'
      - 'scripts/scrape-public-prices.py'
      - 'scripts/price-targets.json'
      - '.github/workflows/update-market-data.yml'

permissions:
  contents: write

concurrency:
  group: india-landing-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check FX and quote parsing against fixtures (offline)
        run: python scripts/update-market-data.py --self-test
      - name: Verify Tutu minimum-price extraction against fixtures (offline)
        run: python scripts/scrape-public-prices.py --self-test
      - name: Install headless browser for public Tutu booking pages
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Find first available prices from tomorrow on public Tutu pages
        run: python scripts/scrape-public-prices.py --out /tmp/tutu-public-price-feed.json
      - name: Fetch CBR FX and publish only verified date-matched prices
        env:
          PRICE_FEED_URL: ${{ secrets.TUTU_PRICE_FEED_URL }}
          PRICE_FEED_TOKEN: ${{ secrets.TUTU_PRICE_FEED_TOKEN }}
          PRICE_FEED_FILE: /tmp/tutu-public-price-feed.json
        run: python scripts/update-market-data.py
      - name: Commit changed public snapshot and trigger Pages rebuild
        run: |
          if git diff --quiet -- assets/daily-prices.js; then
            echo "No changes in the verified public daily data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/daily-prices.js
          git commit -m "data: refresh INR rate and verified card prices"
          git pull --rebase origin main
          git push origin HEAD:main
