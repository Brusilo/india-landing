name: Update India landing FX and verified prices

on:
  schedule:
    # GitHub Actions cron uses UTC. 21:00 UTC = 00:00 Europe/Moscow.
    # Scheduled jobs can begin a little later during GitHub runner congestion.
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-market-data.py'
      - '.github/workflows/update-market-data.yml'

permissions:
  contents: write

concurrency:
  group: india-landing-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check FX and quote parsing against fixtures (offline)
        run: python scripts/update-market-data.py --self-test
      - name: Fetch today's CBR FX and any configured supplier prices
        env:
          PRICE_FEED_URL: ${{ secrets.TUTU_PRICE_FEED_URL }}
          PRICE_FEED_TOKEN: ${{ secrets.TUTU_PRICE_FEED_TOKEN }}
        run: python scripts/update-market-data.py
      - name: Commit changed public snapshot and trigger Pages rebuild
        run: |
          if git diff --quiet -- assets/daily-prices.js; then
            echo "No changes in the verified public daily data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/daily-prices.js
          git commit -m "data: nightly INR rate and verified card prices"
          git pull --rebase origin main
          git push origin HEAD:main
