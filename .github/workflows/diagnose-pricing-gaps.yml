name: Diagnose alternate dated booking quotes

on:
  push:
    paths:
      - '.github/workflows/diagnose-pricing-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install --with-deps chromium
      - name: Probe first available exact-date trip or room, without any private APIs
        shell: bash
        run: |
          python - <<'PY'
          import json,importlib.util
          from datetime import datetime,timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright
          s=importlib.util.spec_from_file_location('p','scripts/scrape-public-prices.py')
          q=importlib.util.module_from_spec(s);s.loader.exec_module(q)
          data=json.loads(Path('scripts/price-targets.json').read_text())
          tomorrow=datetime.now(ZoneInfo('Europe/Moscow')).date()+timedelta(days=1)
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            ctx=b.new_context(locale='ru-RU',timezone_id='Europe/Moscow')
            for id,group in [('r10','routes'),('h5','hotels'),('h10','hotels')]:
              target=data[group][id]
              print('CARD',id,'name',target.get('name'),flush=True)
              for offset in [1,2,3,4,6,7]:
                day=tomorrow+timedelta(days=offset)
                page=ctx.new_page()
                price=q.extract_page(page,group,target,day)
                text=page.locator('body').inner_text(timeout=12000)
                print('PROBE',id,day.isoformat(),'price',price,'book',text.count('Забронировать'),'seats',text.count('Выбрать места'),
                  'soldout','Навыбранные даты всё распродано' in q.clean(text),'top',repr(q.clean(text)[:370]),flush=True)
                page.close()
                if price is not None:break
            ctx.close();b.close()
          PY
