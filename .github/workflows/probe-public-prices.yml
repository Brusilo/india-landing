name: Probe public Tutu pricing availability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-public-prices.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public robots and dated page responses (no bookings)
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib import robotparser,request,parse,error
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          import re
          day=(datetime.now(ZoneInfo('Europe/Moscow'))+timedelta(days=1)).strftime('%d.%m.%Y')
          iso=(datetime.now(ZoneInfo('Europe/Moscow'))+timedelta(days=1)).strftime('%Y-%m-%d')
          next_iso=(datetime.now(ZoneInfo('Europe/Moscow'))+timedelta(days=2)).strftime('%Y-%m-%d')
          items=[
            ('rail SEO','https://www.tutu.ru/poezda/Sankt-Peterburg/Moskva/'),
            ('rail dated','https://www.tutu.ru/poezda/Sankt-Peterburg/Moskva/?'+parse.urlencode({'date':day,'travelers':1})),
            ('air SEO','https://avia.tutu.ru/f/Moskva/Deli/'),
            ('air dated','https://avia.tutu.ru/f/Moskva/Deli/?'+parse.urlencode({'class':'Y','travelers':'1','route[0]':'491-'+day.replace('.','')+'-216'})),
            ('hotel SEO','https://hotel.tutu.ru/h_otel_izmaylovo_alfa/'),
            ('hotel dated','https://hotel.tutu.ru/h_otel_izmaylovo_alfa/?'+parse.urlencode({'check_in':iso,'check_out':next_iso,'room[0]':1}))]
          robots={}
          for label,url in items:
            u=parse.urlparse(url)
            if u.netloc not in robots:
              robot_url=u.scheme+'://'+u.netloc+'/robots.txt'
              try:
                with request.urlopen(request.Request(robot_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as r:
                  txt=r.read(300000).decode('utf-8','replace')
                rp=robotparser.RobotFileParser();rp.parse(txt.splitlines())
                robots[u.netloc]=rp
                print('ROBOTS',u.netloc,'status=loaded lines='+str(len(txt.splitlines())))
              except Exception as exc:
                robots[u.netloc]=None
                print('ROBOTS',u.netloc,'FAILED',type(exc).__name__,str(exc)[:180])
            rp=robots[u.netloc]
            allowed=rp is not None and rp.can_fetch('IndiaLandingPriceResearch',url)
            print('CHECK',label,'allowed='+str(allowed),'URL='+url)
            if not allowed:
              print('SKIP',label,'robot permissions unavailable')
              continue
            try:
              with request.urlopen(request.Request(url,headers={'User-Agent':'IndiaLandingPriceResearch/1.0','Accept-Language':'ru-RU,ru;q=0.9'}),timeout=20) as resp:
                body=resp.read(1500000).decode('utf-8','replace')
                print('FETCH',label,'status',resp.status,'bytes',len(body),'final',resp.url)
              title=re.findall(r'<title[^>]*>(.*?)</title',body,re.I|re.S)
              print('TITLE',re.sub(r'<[^>]+>','',title[0]).strip()[:120] if title else 'missing')
              money=re.findall(r'.{0,30}(?:от|\\u043e\\u0442)\\s*[\\d\\s\\u00a0\\u2009\\u202f]{3,12}\\s*(?:₽|руб)',body,re.I)
              print('PRICE_SNIPPETS',len(money),[re.sub(r'\\s+',' ',m)[:95] for m in money[:6]])
              for test in ['Выберите дату','Уточните даты проживания','__NEXT_DATA__','application/ld+json']:
                print('MARKER',test,test in body)
            except Exception as exc:print('FETCH ERROR',label,type(exc).__name__,str(exc)[:190])
          PY

      - name: Inspect dated hotel page and visible room offers
        shell: bash
        run: |
          python3 - <<'PY'
          import re,html,urllib.request,urllib.parse,datetime
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo
          class Txt(HTMLParser):
            def __init__(self):super().__init__();self.skip=0;self.out=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('script','style','template','noscript'):self.skip+=1
            def handle_endtag(self,tag):
              if tag in ('script','style','template','noscript') and self.skip:self.skip-=1
            def handle_data(self,data):
              if not self.skip and data.strip():self.out.append(data.strip())
          dates=[(datetime.datetime.now(ZoneInfo('Europe/Moscow'))+datetime.timedelta(days=n)).strftime('%Y-%m-%d') for n in (1,2)]
          url='https://hotel.tutu.ru/h_otel_izmaylovo_alfa/?'+urllib.parse.urlencode({'check_in':dates[0],'check_out':dates[1],'room[0]':'1'})
          for u in ['https://hotel.tutu.ru/robots.txt',url]:
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=25)
              body=r.read(1500000).decode('utf-8','replace')
              print('TARGET',u,'bytes',len(body),'status',r.status)
              if u.endswith('robots.txt'):
                print('ROBOTS_TEXT',body[:2500]);continue
              t=Txt();t.feed(body);txt=' '.join(t.out)
              idx=txt.find('Доступные варианты')
              print('VISIBLE_OFFER_CONTEXT',txt[idx:idx+1200] if idx>=0 else txt[:500])
              currency_matches=list(re.finditer('₽|RUB|руб\\.',txt,re.I))
              print('VISIBLE_CURRENCY',len(currency_matches),[txt[max(0,m.start()-75):m.end()+60] for m in currency_matches[:12]])
              for x in ('check_in','check_out','priceWithDiscount','totalPrice','pricePerNight','currency','priceAmount','amountBeforeDiscount','rooms','variants'):
                print('MARKER',x,'count',body.count(x))
              print('ROBOT_HTML_START',body[:100].replace('\\n',' '))
            except Exception as ex:print('TARGET_ERROR',type(ex).__name__,str(ex)[:160])
          PY

      - name: Inspect undated public route SEO prices without searching dated URLs
        shell: bash
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 - <<'PY'
          import re, urllib.request
          from bs4 import BeautifulSoup
          for url in [
            'https://www.tutu.ru/poezda/Sankt-Peterburg/Moskva/',
            'https://www.tutu.ru/poezda/Moskva/Sankt-Peterburg/',
            'https://avia.tutu.ru/f/Moskva/Deli/'
          ]:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ru-RU'}),timeout=25) as resp:
                html=resp.read(2000000).decode('utf-8','replace')
              soup=BeautifulSoup(html,'html.parser')
              for tag in soup(['script','style','template']):tag.decompose()
              print('PUBLIC_PAGE',url,'title',soup.title.get_text(' ',strip=True)[:115],'size',len(html))
              tabs=soup.find_all('table')
              print('TABLES',len(tabs),[(tab.get('class'),len(tab.find_all('tr'))) for tab in tabs[:4]])
              for tr in (tabs[0].find_all('tr')[:5] if tabs else []):
                t=tr.get_text(' ',strip=True)
                print('TABLE_ROW',str(tr.get('class'))[:120],t[:320])
              priceNodes=soup.find_all(string=re.compile(r'(?:от|from)\\s*[0-9\\s\\u00a0\\u2009\\u202f]+\\s*(?:₽|руб)',re.I))
              print('PRICE_NODES',len(priceNodes))
              for item in priceNodes[:8]:
                par=item.parent
                print('PRICE_PARENT',par.name,str(par.get('class'))[:140],par.get_text(' ',strip=True)[:200])
              text=soup.get_text(' ',strip=True)
              p=text.find('Расписание поездов')
              print('SCHEDULE_CONTEXT',text[p:p+340] if p>=0 else 'no schedule heading')
            except Exception as exc:print('PUBLIC_PAGE_ERROR',url,type(exc).__name__,str(exc)[:130])
          PY
