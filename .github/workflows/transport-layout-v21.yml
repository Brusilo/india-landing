name: Refine transport callout and desktop ticket
on:
  push:
    paths:
      - '.github/workflows/transport-layout-v21.yml'
permissions:
  contents: write
jobs:
  refine-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply browser-tested layout changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/responsive.css')
          css = p.read_text(encoding='utf-8')
          old = '''  /* Put the circle beside the heading, with the description full-width below. */
            .panel.panel--transport {
              grid-template-columns: minmax(0, 1fr) 80px;
              column-gap: 16px; row-gap: 12px;
            }
            .panel--transport > div { display: contents; }
            .panel--transport h2 { grid-column: 1; grid-row: 1; }
            .panel--transport p { grid-column: 1 / -1; grid-row: 2; margin-top: 0; }
            .panel.panel--transport .panel-ico {
              grid-column: 2; grid-row: 1; align-self: start; justify-self: end;
              transform: none;
              width: 80px; height: 80px; margin-top: 0;
            }'''
          new = '''  /* Center the circle on the left of the complete text block. */
            .panel.panel--transport {
              grid-template-columns: 80px minmax(0, 1fr);
              padding: 24px 16px;
              column-gap: 12px; row-gap: 12px;
            }
            .panel--transport > div { display: contents; }
            .panel--transport h2 { grid-column: 2; grid-row: 1; }
            .panel--transport p { grid-column: 2; grid-row: 2; margin-top: 0; }
            .panel.panel--transport .panel-ico {
              grid-column: 1; grid-row: 1 / 3; align-self: center; justify-self: start;
              transform: none;
              width: 80px; height: 80px; margin-top: 0;
            }'''
          assert css.count(old) == 1, 'Transport layout changed; review before applying'
          css = css.replace(old, new, 1)
          old_tablet = '.panel.panel--transport { grid-template-columns: minmax(0,1fr) 104px; column-gap: 24px; }'
          new_tablet = '.panel.panel--transport { grid-template-columns: 104px minmax(0,1fr); padding: 32px; column-gap: 24px; }'
          assert css.count(old_tablet) == 1
          css = css.replace(old_tablet, new_tablet, 1)
          old_small = '''  .panel.panel--transport { grid-template-columns: minmax(0,1fr) 72px; column-gap: 12px; }
            .panel.panel--transport .panel-ico { width: 72px; height: 72px; }'''
          new_small = '''  .panel.panel--transport { grid-template-columns: 64px minmax(0,1fr); padding: 20px 16px; column-gap: 12px; }
            .panel.panel--transport .panel-ico { width: 64px; height: 64px; }'''
          assert css.count(old_small) == 1
          css = css.replace(old_small, new_small, 1)
          css += '''

          /* Desktop ticket: lift by 25px, preserving its size and rotation. */
          @media (min-width: 1101px) {
            #routes > .section-decor--ticket { top: 3px !important; }
          }
          @media (min-width: 1101px) and (max-width: 1200px) {
            #routes > .section-decor--ticket { top: 5px !important; }
          }
          '''
          p.write_text(css, encoding='utf-8')
          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'assets/responsive\.css\?v=[^"\s]+', 'assets/responsive.css?v=20260917-transport-21', text)
              assert count == 1, filename
              p.write_text(text, encoding='utf-8')
          Path('.github/workflows/transport-layout-v21.yml').unlink()
          print('Transport circle centered left on compact screens; desktop ticket lifted 25px; copy and scripts unchanged.')
          PY
      - name: Commit scoped layout changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/transport-layout-v21.yml
          git diff --cached --check
          git commit -m 'style: center mobile transport icon left and lift desktop ticket 25px'
          git push
