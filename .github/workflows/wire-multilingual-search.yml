name: Wire multilingual place search

on:
  push:
    paths:
      - '.github/workflows/wire-multilingual-search.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch search
        run: python3 .github/scripts/wire_search.py
      - name: Validate search
        run: |
          node .github/scripts/validate_search.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html assets/search-places.js
          git commit -m "Implement multilingual destination autocomplete"
          git push origin HEAD:main
