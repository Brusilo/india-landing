name: Polish carousel headers and transport icons
on:
  push:
    paths:
      - '.github/workflows/mobile-ui-polish-v19.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply browser-tested layout and copy refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          css_path = Path('assets/responsive.css')
          css = css_path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global css
              assert css.count(old) == 1, 'Expected unique CSS target: ' + old[:100]
              css = css.replace(old, new, 1)

          replace_once('/* Compact layout only. The existing desktop design stays unchanged above 1100px. */',
          '''/* Compact layout and shared, explicitly scoped icon refinements. */
          /* Match the visual size of the Apple badge to the other store badges. */
          .footer-app-col .stores img[src$="/store-apple.png"] {
            transform: scale(1.08);
            transform-origin: center;
          }
          /* Only the transport callout gets a larger illustration. */
          .panel--transport .panel-ico { width: 128px; height: 128px; }''')
          replace_once('  .head-actions__nav { display: none; }',
          '''  .head-actions__nav { display: none; }
            /* Remove the entire header-action row, not just the link, on compact screens. */
            #routes .section-head > .head-actions,
            #hotels .section-head > .head-actions { display: none; }
            #routes .section-head--row,
            #hotels .section-head--row { gap: 0; }''')
          replace_once('  .panel-ico { width: 56px; height: 56px; margin-top: 6px; }',
          '''  .panel-ico { width: 56px; height: 56px; margin-top: 6px; }
            /* Keep the heading full-width so the larger circle cannot squeeze it. */
            .panel.panel--transport {
              grid-template-columns: minmax(0, 1fr) 80px;
              column-gap: 16px; row-gap: 12px;
            }
            .panel--transport > div { display: contents; }
            .panel--transport h2 { grid-column: 1 / -1; }
            .panel--transport p { grid-column: 1; margin-top: 0; }
            .panel.panel--transport .panel-ico {
              grid-column: 2; grid-row: 2; align-self: center; justify-self: end;
              width: 80px; height: 80px; margin-top: 0;
            }''')
          replace_once('  .panel-ico { width: 80px; height: 80px; }',
          '''  .panel-ico { width: 80px; height: 80px; }
            .panel.panel--transport { grid-template-columns: minmax(0,1fr) 104px; column-gap: 24px; }
            .panel.panel--transport .panel-ico { width: 104px; height: 104px; }''')
          replace_once('  .panel-ico { width: 48px; height: 48px; }',
          '''  .panel-ico { width: 48px; height: 48px; }
            .panel.panel--transport { grid-template-columns: minmax(0,1fr) 72px; column-gap: 12px; }
            .panel.panel--transport .panel-ico { width: 72px; height: 72px; }''')
          css_path.write_text(css, encoding='utf-8')

          copy = {
              'index.html': ('Доберётесь до любого города', 'Доберитесь из своего города'),
              'index-en.html': ('Get to any city', 'Travel from your city'),
              'index-hi.html': ('किसी भी शहर तक पहुँचें', 'अपने शहर से यात्रा करें'),
          }
          for filename, (old, new) in copy.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              assert text.count('<h2>' + old + '</h2>') == 1, filename + ': heading'
              assert text.count('class="panel panel--accent"') == 1, filename + ': panel'
              text = text.replace('<h2>' + old + '</h2>', '<h2>' + new + '</h2>', 1)
              text = text.replace('class="panel panel--accent"', 'class="panel panel--accent panel--transport"', 1)
              text, count = re.subn(r'assets/responsive\.css\?v=[^"\s]+', 'assets/responsive.css?v=20260917-mobile-19', text)
              assert count == 1, filename + ': stylesheet'
              p.write_text(text, encoding='utf-8')

          expected = {
              'assets/responsive.css': '6e47742251ffde5c5da10f6583be4a18899b6f1b031a2e127049f339427d5326',
              'index.html': '7aae3cef62d1239164f04c1e1a2b2764645ec47a48d6581a6ef674f1cdaff7f5',
              'index-en.html': '546999d1d79b8dbd1133aa75aa464ea19c7c5fb5c3432795c44aa68f9b667427',
              'index-hi.html': 'c0030899384b5604e808d59fe6ba37a7120167a2b891f623ba82fdcf9f59d5da',
          }
          for filename, digest in expected.items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest, filename + ': differs from browser-tested content'
          Path('.github/workflows/mobile-ui-polish-v19.yml').unlink()
          print('All four changed files exactly match the locally tested candidate.')
          PY
      - name: Commit tested refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/mobile-ui-polish-v19.yml
          git diff --cached --check
          git commit -m 'style: compact mobile carousel headings and refine transport and Apple icons'
          git push
