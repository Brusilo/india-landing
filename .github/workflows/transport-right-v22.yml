name: Move compact transport circle right
on:
  push:
    paths:
      - '.github/workflows/transport-right-v22.yml'
permissions:
  contents: write
jobs:
  move-circle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested right-side layout without changing sizes or copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('assets/responsive.css')
          raw = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert sha == '6614f56bbf9c681f1f20047b68a788cd0a11a1f1', 'Responsive CSS changed; review before applying'
          css = raw.decode('utf-8')
          replacements = {
              '/* Center the circle on the left of the complete text block. */':
              '/* Center the circle on the right of the complete text block. */',
              'grid-template-columns: 80px minmax(0, 1fr);':
              'grid-template-columns: minmax(0, 1fr) 80px;',
              '.panel--transport h2 { grid-column: 2; grid-row: 1; }':
              '.panel--transport h2 { grid-column: 1; grid-row: 1; }',
              '.panel--transport p { grid-column: 2; grid-row: 2; margin-top: 0; }':
              '.panel--transport p { grid-column: 1; grid-row: 2; margin-top: 0; }',
              'grid-column: 1; grid-row: 1 / 3; align-self: center; justify-self: start;':
              'grid-column: 2; grid-row: 1 / 3; align-self: center; justify-self: end;',
              '.panel.panel--transport { grid-template-columns: 104px minmax(0,1fr); padding: 32px; column-gap: 24px; }':
              '.panel.panel--transport { grid-template-columns: minmax(0,1fr) 104px; padding: 32px; column-gap: 24px; }',
              '.panel.panel--transport { grid-template-columns: 64px minmax(0,1fr); padding: 20px 16px; column-gap: 12px; }':
              '.panel.panel--transport { grid-template-columns: minmax(0,1fr) 64px; padding: 20px 16px; column-gap: 12px; }',
          }
          for old, new in replacements.items():
              assert css.count(old) == 1, 'Unexpected selector: ' + old
              css = css.replace(old, new, 1)
          p.write_text(css, encoding='utf-8')
          for filename in ('index.html', 'index-en.html', 'index-hi.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              old = 'assets/responsive.css?v=20260917-transport-21'
              assert text.count(old) == 1, filename + ': expected stylesheet version'
              p.write_text(text.replace(old, 'assets/responsive.css?v=20260917-transport-22', 1), encoding='utf-8')
          Path('.github/workflows/transport-right-v22.yml').unlink()
          print('Transport circle moved right on compact screens; copy, sizes, spacing and desktop unchanged.')
          PY
      - name: Commit scoped layout change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/responsive.css index.html index-en.html index-hi.html .github/workflows/transport-right-v22.yml
          git diff --cached --check
          git commit -m 'style: center transport circle on the right on mobile and tablet'
          git push
