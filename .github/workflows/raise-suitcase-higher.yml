name: Raise suitcase higher

on:
  push:
    paths:
      - '.github/workflows/raise-suitcase-higher.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raise suitcase substantially
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('index-en.html'), Path('index-hi.html')]
          replacements = [
              ('  top:54px!important;', '  top:8px!important;'),
              ('.hero>.hero-decor--suitcase{width:575px!important;right:-18px!important;top:54px!important;bottom:auto!important}',
               '.hero>.hero-decor--suitcase{width:575px!important;right:-18px!important;top:12px!important;bottom:auto!important}'),
              ('.hero>.hero-decor--suitcase{width:275px!important;right:-38px!important;top:78px!important;bottom:auto!important;opacity:.82!important}',
               '.hero>.hero-decor--suitcase{width:275px!important;right:-38px!important;top:40px!important;bottom:auto!important;opacity:.82!important}'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected suitcase rule not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-en.html index-hi.html
          git diff --cached --check
          git commit -m "Raise suitcase artwork higher"
          git push origin HEAD:main
